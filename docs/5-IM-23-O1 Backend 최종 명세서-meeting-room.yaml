# 5-IM-23-O1 Backend 최종 명세서-meeting-room
# 참조: 5-IM-23 Backend 최종 명세서 생성 [DV]
# 소스 우선순위: API 명세서 > entities.yaml > 업무프로세스 정의서 > 공통 개발규칙 > Backend 초안

program:
  id: "meeting-room"
  name: "회의실"
  project: "회의실 예약 시스템"
  version: "1.0.1"
  author: "설동혁 DV"
  authored_at: "2026-10-27"
  history:
    - version: "1.0"
      date: "2026-10-27"
      by: "설동혁 DV"
      note: "최초 작성"
    - version: "1.0.1"
      date: "2026-10-27"
      by: "설동혁 DV"
      note: "정정 — 5-IM-24 착수 중 발견: 저장소 정렬 동작에 속하는 TE-meeting-room-U04 desc를 단위 경계에 맞게 고쳤다. 동작 변경 없음"

source_inputs:
  api_spec: "5-IM-12-O1 API 명세서-meeting-room.yaml"
  entity_spec: "entities.yaml"
  backend_common_rules: "4-DN-21-O3 공통 개발규칙.md"
  backend_draft: "5-IM-21-O1 Backend 초안-meeting-room.md"
  domain_process: "3-AN-09-O1 업무프로세스 정의서.md"

api_contract:
  domain: "meeting-room"
  endpoints:
    - id: "meeting-room-001"
      method: "GET"
      path: "/api/v1/meeting-rooms"
      req: ["REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-007", "REQ-F-008"]
      request_schema: null
      response_schema: "MeetingRoomItem[]"
      errors: ["UNAUTHORIZED", "INTERNAL"]
    - id: "meeting-room-002"
      method: "POST"
      path: "/api/v1/meeting-rooms"
      req: ["REQ-F-007"]
      request_schema: "MeetingRoomCreateRequest"
      response_schema: "MeetingRoomItem"
      errors: ["BAD_REQUEST", "UNAUTHORIZED", "FORBIDDEN", "INTERNAL"]
    - id: "meeting-room-003"
      method: "GET"
      path: "/api/v1/meeting-rooms/{meetingRoomId}"
      req: ["REQ-F-007"]
      request_schema: null
      response_schema: "MeetingRoomItem"
      errors: ["UNAUTHORIZED", "FORBIDDEN", "NOT_FOUND", "INTERNAL"]
    - id: "meeting-room-004"
      method: "PUT"
      path: "/api/v1/meeting-rooms/{meetingRoomId}"
      req: ["REQ-F-007"]
      request_schema: "MeetingRoomUpdateRequest"
      response_schema: "MeetingRoomItem"
      errors: ["BAD_REQUEST", "UNAUTHORIZED", "FORBIDDEN", "NOT_FOUND", "INTERNAL"]
    - id: "meeting-room-005"
      method: "GET"
      path: "/api/v1/admin/reservations"
      req: ["REQ-F-006", "REQ-F-008"]
      request_schema: null
      response_schema: "AdminReservationItem[]"
      errors: ["BAD_REQUEST", "UNAUTHORIZED", "FORBIDDEN", "INTERNAL"]

domain_context:
  entities:
    - "ENT-01: MeetingRoom(MeetingRoomEntity) — 예약 대상 회의실 정보"
    - "ENT-02: Reservation — 예약 도메인 소유, 이 도메인은 서비스 계약(findActiveReservationsInPeriod)으로만 접근"
  state_transitions: []
  business_rules:
    - id: "BR-03"
      description: "회의실 관리 담당자가 회의실·기간별 예약 내용(시간·예약자·회의 제목)을 조회한다. 회의 제목은 ROOM_MANAGER에게 항상 보인다"
      enforcement: "meeting-room-005"

schema_context:
  tables:
    - table: "meeting_room"
      entity: "MeetingRoom"
      relevant_fields:
        - column: "meeting_room_id"
          type: "Long"
          nullable: false
          description: "PK, 자동 증가"
        - column: "name"
          type: "String(100)"
          nullable: false
          description: "회의실명"
        - column: "location"
          type: "String(200)"
          nullable: true
          description: "위치. 표기 형식 미확정(조건 C1)"
        - column: "capacity"
          type: "Integer"
          nullable: true
          description: "수용 인원. 필수 여부 미확정(조건 C1)"
        - column: "equipment"
          type: "String(500)"
          nullable: true
          description: "비치 장비 설명(텍스트)"
      relations:
        - "REL-02: MeetingRoom → Reservation (1:N) — 이 도메인에서는 연관관계 필드를 쓰지 않는다"

backend_common_rules:
  response_style: "Envelope — 4-DN-21-O3 §2. 성공은 data에 DTO, 오류는 error.code·message(·errors)와 meta. 봉투 생성은 EnvelopeFactory 빈"
  paging: "해당 없음 — 이 도메인 목록 operation에 페이징이 없다(화면 명세에 요구 없음)"
  exception_handling: "공통 GlobalExceptionHandler(5-IM-04)가 처리한다. 업무 오류는 BusinessException(ErrorCode)을 던진다"
  transaction: "서비스 메서드 기본 읽기 전용(@Transactional(readOnly = true)), 변경은 @Transactional"
  logging: "[레벨] [requestId] [클래스명.메서드명] 메시지. 4xx는 WARN, 5xx는 ERROR"
  project_specific:
    - "인증은 서버 세션이며 AuthFilter가 로그인을 요구한다. 역할 판정은 서비스 진입에서 CurrentUserProvider.require()로 사용자를 얻고 LoginUser.hasRole(\"ROOM_MANAGER\")로 확인한다. 아니면 BusinessException(ErrorCode.FORBIDDEN)"
    - "다른 도메인의 Repository·엔티티를 직접 다루지 않는다. 예약 정보는 예약 도메인 서비스 계약으로만 얻는다"
    - "서비스 사이 순환 의존 금지 — MeetingRoomService는 다른 도메인 서비스를 호출하지 않고, AdminReservationQueryService가 예약 도메인 서비스 계약과 MeetingRoomService를 조합한다"

backend_design:
  endpoints:
    - id: "meeting-room-001"
      description: "등록된 회의실 전체를 회의실명 순으로 돌려준다. 예약 화면들도 쓰므로 로그인한 USER·ROOM_MANAGER 모두 허용"
      validation: []
      authorization:
        roles:
          - role: "USER"
            condition: "조회만"
          - role: "ROOM_MANAGER"
            condition: "조건 없음"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
      persistence:
        query_strategy: "[JPA] MeetingRoomRepository 프로젝션 전체 조회(name 오름차순)"
      response_mapping:
        success: "data에 MeetingRoomItem 배열. 회의실이 없으면 빈 배열"
      error_mapping:
        - http: 401
          code: UNAUTHORIZED
          condition: "로그인하지 않음"
        - http: 500
          code: INTERNAL
          condition: "조회 실패"
    - id: "meeting-room-002"
      description: "회의실을 등록한다"
      validation:
        - field: "name"
          rule: "필수, 공백 제거 후 1~100자"
          error: "BAD_REQUEST"
        - field: "location"
          rule: "선택, 최대 200자"
          error: "BAD_REQUEST"
        - field: "capacity"
          rule: "선택, 정수"
          error: "BAD_REQUEST"
        - field: "equipment"
          rule: "선택, 최대 500자"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ROOM_MANAGER"
            condition: "조건 없음"
      transaction:
        boundary: "단일 서비스 메서드 @Transactional"
        isolation: "READ_COMMITTED (기본)"
      persistence:
        query_strategy: "없음"
        write_operations:
          - "MeetingRoomEntity 생성 후 MeetingRoomRepository.save"
      response_mapping:
        success: "201, data에 MeetingRoomItem"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "회의실명 누락·길이 초과, 형식 오류(EX-MTR-01)"
        - http: 403
          code: FORBIDDEN
          condition: "ROOM_MANAGER가 아님(EX-MTR-02)"
        - http: 500
          code: INTERNAL
          condition: "저장 실패(EX-MTR-03)"
    - id: "meeting-room-003"
      description: "회의실 한 곳을 돌려준다(변경 화면용)"
      validation:
        - field: "meetingRoomId"
          rule: "경로 변수, 양의 정수(형식 오류는 공통 핸들러 400)"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ROOM_MANAGER"
            condition: "조건 없음"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
      persistence:
        query_strategy: "[JPA] MeetingRoomRepository.findById"
      response_mapping:
        success: "data에 MeetingRoomItem"
      error_mapping:
        - http: 403
          code: FORBIDDEN
          condition: "ROOM_MANAGER가 아님"
        - http: 404
          code: NOT_FOUND
          condition: "없는 회의실"
    - id: "meeting-room-004"
      description: "회의실을 변경한다(전체 교체)"
      validation:
        - field: "name"
          rule: "필수, 공백 제거 후 1~100자"
          error: "BAD_REQUEST"
        - field: "location, capacity, equipment"
          rule: "선택. 길이·형식은 등록과 같다"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ROOM_MANAGER"
            condition: "조건 없음"
      transaction:
        boundary: "단일 서비스 메서드 @Transactional"
        isolation: "READ_COMMITTED (기본), 마지막 저장이 이긴다"
      persistence:
        query_strategy: "[JPA] MeetingRoomRepository.findById"
        write_operations:
          - "MeetingRoomEntity.update(name, location, capacity, equipment) — 변경 감지로 갱신"
      response_mapping:
        success: "data에 MeetingRoomItem"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "입력 오류(EX-MTR-01)"
        - http: 403
          code: FORBIDDEN
          condition: "ROOM_MANAGER가 아님(EX-MTR-02)"
        - http: 404
          code: NOT_FOUND
          condition: "없는 회의실"
        - http: 500
          code: INTERNAL
          condition: "저장 실패(EX-MTR-03)"
    - id: "meeting-room-005"
      description: "회의실·기간별 전체 예약(시간·예약자·회의 제목)을 조회한다"
      validation:
        - field: "from, to"
          rule: "필수, YYYY-MM-DD, 시작일이 종료일보다 늦으면 안 됨"
          error: "BAD_REQUEST"
        - field: "meetingRoomId"
          rule: "선택, 숫자"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ROOM_MANAGER"
            condition: "조건 없음"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용), 예약 도메인 서비스 호출이 같은 트랜잭션에 참여"
      persistence:
        query_strategy: "ReservationService.findActiveReservationsInPeriod 호출 후 MeetingRoomService.findNamesByIds로 회의실명 결합"
      response_mapping:
        success: "data에 AdminReservationItem 배열(시작 일시 순). 없으면 빈 배열"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "기간 형식 오류, 시작일이 종료일보다 늦음(EX-MTR-04)"
        - http: 401
          code: UNAUTHORIZED
          condition: "로그인하지 않음(EX-MTR-05)"
        - http: 403
          code: FORBIDDEN
          condition: "ROOM_MANAGER가 아님"
        - http: 500
          code: INTERNAL
          condition: "예약 조회 실패(EX-MTR-06)"

implementation_targets:
  controller:
    classes:
      - class: "MeetingRoomController"
        package: "com.example.meetingroom.domain.meetingroom.controller"
        endpoints:
          - id: "meeting-room-001"
            method_name: "findAll"
            annotations:
              - "@GetMapping(\"/api/v1/meeting-rooms\")"
            request_type: null
            response_type: "Envelope<List<MeetingRoomItemResponse>>"
          - id: "meeting-room-002"
            method_name: "create"
            annotations:
              - "@PostMapping(\"/api/v1/meeting-rooms\")"
              - "@ResponseStatus(HttpStatus.CREATED)"
            request_type: "MeetingRoomCreateRequest"
            response_type: "Envelope<MeetingRoomItemResponse>"
          - id: "meeting-room-003"
            method_name: "findOne"
            annotations:
              - "@GetMapping(\"/api/v1/meeting-rooms/{meetingRoomId}\")"
            request_type: "meetingRoomId (경로 변수 Long)"
            response_type: "Envelope<MeetingRoomItemResponse>"
          - id: "meeting-room-004"
            method_name: "update"
            annotations:
              - "@PutMapping(\"/api/v1/meeting-rooms/{meetingRoomId}\")"
            request_type: "MeetingRoomUpdateRequest"
            response_type: "Envelope<MeetingRoomItemResponse>"
      - class: "AdminReservationController"
        package: "com.example.meetingroom.domain.meetingroom.controller"
        endpoints:
          - id: "meeting-room-005"
            method_name: "findReservations"
            annotations:
              - "@GetMapping(\"/api/v1/admin/reservations\")"
              - "from·to는 @RequestParam @DateTimeFormat(iso = ISO.DATE) LocalDate, meetingRoomId는 선택 Long"
            request_type: "from, to, meetingRoomId (쿼리 문자열)"
            response_type: "Envelope<List<AdminReservationItemResponse>>"

  dto:
    request:
      - name: "MeetingRoomCreateRequest"
        fields:
          - name: "name"
            type: "String"
            validation: "@NotBlank @Size(max = 100)"
            description: "회의실명"
          - name: "location"
            type: "String"
            validation: "@Size(max = 200)"
            description: "위치(선택)"
          - name: "capacity"
            type: "Integer"
            validation: "없음 (정수)"
            description: "수용 인원(선택)"
          - name: "equipment"
            type: "String"
            validation: "@Size(max = 500)"
            description: "비치 장비 설명(선택)"
      - name: "MeetingRoomUpdateRequest"
        fields:
          - name: "name"
            type: "String"
            validation: "@NotBlank @Size(max = 100)"
            description: "회의실명"
          - name: "location"
            type: "String"
            validation: "@Size(max = 200)"
            description: "위치(선택)"
          - name: "capacity"
            type: "Integer"
            validation: "없음 (정수)"
            description: "수용 인원(선택)"
          - name: "equipment"
            type: "String"
            validation: "@Size(max = 500)"
            description: "비치 장비 설명(선택)"
    response:
      - name: "MeetingRoomItemResponse"
        fields:
          - name: "meetingRoomId"
            type: "Long"
            description: "회의실 식별자"
          - name: "name"
            type: "String"
            description: "회의실명"
          - name: "location"
            type: "String"
            description: "위치"
          - name: "capacity"
            type: "Integer"
            description: "수용 인원"
          - name: "equipment"
            type: "String"
            description: "비치 장비 설명"
      - name: "AdminReservationItemResponse"
        fields:
          - name: "reservationId"
            type: "Long"
            description: "예약 식별자(취소 요청 reservation-008에 쓴다)"
          - name: "meetingRoomId"
            type: "Long"
            description: "회의실 식별자"
          - name: "meetingRoomName"
            type: "String"
            description: "회의실명"
          - name: "reserverName"
            type: "String"
            description: "예약자 이름(예약 도메인 값)"
          - name: "startAt"
            type: "LocalDateTime"
            description: "시작 일시"
          - name: "endAt"
            type: "LocalDateTime"
            description: "종료 일시"
          - name: "title"
            type: "String"
            description: "회의 제목"

  service:
    classes:
      - class: "MeetingRoomService"
        package: "com.example.meetingroom.domain.meetingroom.service"
        methods:
          - name: "findAll"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. CurrentUserProvider.require()로 로그인을 확인한다(없으면 401)"
              - "2. MeetingRoomRepository.findAllItems()로 회의실명 오름차순 프로젝션을 조회한다"
              - "3. MeetingRoomItemResponse 목록을 반환한다(없으면 빈 목록)"
          - name: "create"
            transaction: "@Transactional"
            steps:
              - "1. 현재 사용자가 ROOM_MANAGER인지 확인한다. 아니면 BusinessException(FORBIDDEN)"
              - "2. name이 공백뿐이거나 100자 초과면 BusinessException(BAD_REQUEST, mtr.edit.name.required 문구)"
              - "3. MeetingRoomEntity(name, location, capacity, equipment)를 save한다(공백 문자열은 null로 정리)"
              - "4. MeetingRoomItemResponse로 반환한다"
          - name: "findOne"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 현재 사용자가 ROOM_MANAGER인지 확인한다. 아니면 BusinessException(FORBIDDEN)"
              - "2. findById — 없으면 BusinessException(NOT_FOUND)"
              - "3. MeetingRoomItemResponse로 반환한다"
          - name: "update"
            transaction: "@Transactional"
            steps:
              - "1. 현재 사용자가 ROOM_MANAGER인지 확인한다. 아니면 BusinessException(FORBIDDEN)"
              - "2. findById — 없으면 BusinessException(NOT_FOUND)"
              - "3. 입력을 create와 같은 규칙으로 확인한다"
              - "4. MeetingRoomEntity.update(name, location, capacity, equipment)로 전체 교체한다"
              - "5. MeetingRoomItemResponse로 반환한다"
          - name: "existsById"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 다른 도메인이 호출하는 서비스 계약이다(service_contracts 참조). MeetingRoomRepository.existsById를 반환한다"
          - name: "findNamesByIds"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 다른 도메인이 호출하는 서비스 계약이다(service_contracts 참조). 식별자 집합이 비어 있으면 빈 맵을 반환한다"
              - "2. MeetingRoomRepository.findNameRows(ids)로 한 번에 조회해 {식별자 → 회의실명} 맵을 반환한다"
      - class: "AdminReservationQueryService"
        package: "com.example.meetingroom.domain.meetingroom.service"
        methods:
          - name: "findReservations"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 현재 사용자가 ROOM_MANAGER인지 확인한다. 아니면 BusinessException(FORBIDDEN)"
              - "2. from이 to보다 늦으면 BusinessException(BAD_REQUEST, mtr.all.period.invalid 문구)"
              - "3. ReservationService.findActiveReservationsInPeriod(from, to, meetingRoomId)로 예약을 얻는다"
              - "4. 예약의 회의실 식별자 집합으로 MeetingRoomService.findNamesByIds를 한 번 호출해 회의실명을 붙인다"
              - "5. 시작 일시 순의 AdminReservationItemResponse 목록을 반환한다"

  service_contracts:
    - method: "MeetingRoomService.existsById"
      called_by: ["reservation"]
      signature: "boolean existsById(Long meetingRoomId)"
      req: ["REQ-F-003", "REQ-F-004"]
      description: "회의실이 존재하는지 돌려준다. 예외 없음"
    - method: "MeetingRoomService.findNamesByIds"
      called_by: ["reservation"]
      signature: "Map<Long, String> findNamesByIds(Collection<Long> meetingRoomIds)"
      req: ["REQ-F-002", "REQ-F-003", "REQ-F-004", "REQ-F-005"]
      description: "회의실 식별자 집합으로 {식별자 → 회의실명}을 한 번에 돌려준다. 없는 식별자는 결과에 없다. 예외 없음"

  data_changes:
    - kind: "비기능 클래스"
      req: ["REQ-F-007"]
      target: "domain.meetingroom.entity.MeetingRoomEntity.update(String name, String location, Integer capacity, String equipment)"
      description: "회의실 변경 메서드를 엔티티에 추가한다 — 네 필드를 전체 교체한다. 엔티티 코드 구현(5-IM-06)에는 변경 메서드가 없다"

  mapper:
    - name: "MeetingRoomMapper"
      type: "manual"
      mappings:
        - "MeetingRoomEntity → MeetingRoomItemResponse: MeetingRoomItemResponse.from(entity) (정적 팩토리, 서비스에서 호출)"
        - "프로젝션 행(MeetingRoomItemRow) → MeetingRoomItemResponse: 서비스에서 변환"
        - "MeetingRoomCreateRequest·MeetingRoomUpdateRequest → MeetingRoomEntity: 서비스 메서드 안에서 생성자·update로 변환"
        - "ActiveReservation(예약 도메인 계약 반환값) → AdminReservationItemResponse: AdminReservationQueryService에서 회의실명을 붙여 변환"

  repository:
    persistence: "jpa"
    interfaces:
      - name: "MeetingRoomRepository"
        type: "JpaRepository"
        custom_queries:
          - "@Query 프로젝션 List<MeetingRoomItemRow> findAllItems() — 전체 회의실, name 오름차순, 엔티티를 거치지 않는다"
          - "@Query 프로젝션 List<MeetingRoomNameRow> findNameRows(Collection<Long> ids) — 식별자 집합의 {meetingRoomId, name}"
    querydsl:
      used: false
      methods: []

  validation:
    rules:
      - id: "BR-03"
        check: "전체 예약 조회는 ROOM_MANAGER만 가능하고 회의 제목은 항상 포함한다. 취소된 예약은 제외한다"
        throw: "BusinessException(ErrorCode.FORBIDDEN)"
      - id: "REQ-F-007"
        check: "회의실명은 공백 제거 후 1~100자. 위치 200자, 비치 장비 500자 이내"
        throw: "BusinessException(ErrorCode.BAD_REQUEST, \"회의실명을 입력해 주세요.\")"
      - id: "REQ-F-008"
        check: "조회 기간의 시작일이 종료일보다 늦으면 안 된다(같은 날 허용)"
        throw: "BusinessException(ErrorCode.BAD_REQUEST, \"조회 기간의 시작일이 종료일보다 늦을 수 없습니다.\")"

  authorization:
    method_level: "회의실 목록(meeting-room-001)만 로그인한 모든 사용자, 나머지는 서비스 진입에서 ROOM_MANAGER를 확인한다. AuthFilter가 로그인 자체를 요구한다"
    data_level: "해당 없음 — 회의실은 모든 사용자에게 같은 데이터다"

  transaction:
    read_only_default: true
    write_methods:
      - "MeetingRoomService.create"
      - "MeetingRoomService.update"

  error_handling:
    additional: []
    state_dependent_validation:
      - trigger: "회의실 입력 검증 실패(공백 이름 등 서비스에서 검증하는 경우)"
        http: 400
        details_format: null
      - trigger: "조회 기간 시작일이 종료일보다 늦음(meeting-room-005)"
        http: 400
        details_format: null

  test_expectations:
    unit:
      - id: "TE-meeting-room-U01"
        req: ["REQ-F-007"]
        endpoint: "meeting-room-002"
        desc: "MeetingRoomService.create — ROOM_MANAGER가 아니면 FORBIDDEN, 공백 이름은 BAD_REQUEST, 성공 시 선택 항목의 공백 문자열은 null로 저장된다"
      - id: "TE-meeting-room-U02"
        req: ["REQ-F-007"]
        endpoint: "meeting-room-004"
        desc: "MeetingRoomService.update — 네 필드를 전체 교체하고 없는 회의실은 NOT_FOUND, ROOM_MANAGER가 아니면 FORBIDDEN"
      - id: "TE-meeting-room-U03"
        req: ["REQ-F-007"]
        endpoint: "meeting-room-003"
        desc: "MeetingRoomService.findOne — 없는 회의실은 NOT_FOUND, ROOM_MANAGER가 아니면 FORBIDDEN"
      - id: "TE-meeting-room-U04"
        req: ["REQ-F-002"]
        endpoint: "meeting-room-001"
        desc: "MeetingRoomService.findAll — 일반 사용자에게도 저장소가 준 회의실명 순서 그대로 전체를 반환하고 회의실이 없으면 빈 목록"
      - id: "TE-meeting-room-U05"
        req: ["REQ-F-003", "REQ-F-004"]
        endpoint: null
        desc: "MeetingRoomService.existsById(서비스 계약) — 있는 회의실 true, 없는 회의실 false"
      - id: "TE-meeting-room-U06"
        req: ["REQ-F-005"]
        endpoint: null
        desc: "MeetingRoomService.findNamesByIds(서비스 계약) — 식별자 집합을 한 번 조회로 맵으로 돌려주고 없는 식별자는 빠지며 빈 집합은 빈 맵"
      - id: "TE-meeting-room-U07"
        req: ["REQ-F-008"]
        endpoint: "meeting-room-005"
        desc: "AdminReservationQueryService.findReservations — 시작일이 종료일보다 늦으면 BAD_REQUEST, 같은 날은 허용, 예약 도메인 결과에 회의실명을 붙여 시작 일시 순으로 반환"
      - id: "TE-meeting-room-U08"
        req: ["REQ-F-006"]
        endpoint: "meeting-room-005"
        desc: "AdminReservationQueryService.findReservations — ROOM_MANAGER가 아니면 FORBIDDEN"
    integration:
      - id: "TE-meeting-room-I01"
        req: ["REQ-F-007"]
        endpoint: "meeting-room-002"
        desc: "회의실 등록·상세·변경 API — 201, 200 흐름과 변경 값이 목록에 반영됨, 일반 사용자는 403 봉투, 입력 오류는 400, 없는 회의실은 404(Testcontainers PostgreSQL)"
      - id: "TE-meeting-room-I02"
        req: ["REQ-F-002", "REQ-F-003", "REQ-F-004"]
        endpoint: "meeting-room-001"
        desc: "회의실 목록 API — 로그인한 일반 사용자와 ROOM_MANAGER 모두 200, 로그인하지 않으면 401 봉투"
      - id: "TE-meeting-room-I03"
        req: ["REQ-F-008"]
        endpoint: "meeting-room-005"
        desc: "전체 예약 조회 API — 기간·회의실 필터, 취소된 예약 제외, 회의 제목 포함, 기간 오류 400"
      - id: "TE-meeting-room-I04"
        req: ["REQ-F-006"]
        endpoint: "meeting-room-005"
        desc: "일반 사용자가 전체 예약 조회를 호출하면 403 봉투를 받는다"

assumptions:
  - "위치 표기 형식·수용 인원 필수 여부는 미확정(조건 C1)이라 서버는 길이·정수 검증만 하고 형식은 강제하지 않는다. 확정되면 개정한다"
  - "회의실 이름 중복을 허용한다(요구사항에 제한이 없다)"
  - "회의실 변경은 낙관적 잠금 없이 마지막 저장이 이긴다(엔티티 명세에 버전 컬럼 없음)"
  - "회의실 삭제는 요구사항에 없어 만들지 않는다"
  - "REQ-NF-001 로그인하지 않은 접근 차단은 공통 AuthFilter(5-IM-04)가 구현한다. API 명세서에서 REQ-NF-001은 x-nf-req-ids에만 있어 api_contract.endpoints[].req에 넣지 않는다"
  - "페이징과 조회 기간 상한은 두지 않는다(화면 명세에 요구 없음)"
  - "경로 변수 형식 오류는 API 계약에 선언되지 않은 기반 오류이며 공통 예외 핸들러가 400으로 돌려준다"

generation_notes:
  - "패키지 접두 com.example.meetingroom은 임시다(수행 조직 확정 시 변경, 5-IM-05-O1 §3)"
  - "저장소 convention — JPA 파생 쿼리·@Query를 쓰고 QueryDSL은 도입하지 않는다(querydsl.used false). 목록 조회는 프로젝션 DTO를 직접 반환한다(4-DN-21-O3 Repository 규칙)"
  - "엔티티에 변경 메서드가 없다 — MeetingRoomEntity.update를 data_changes대로 추가한다(엔티티는 5-IM-06 산출물이라 수정 범위를 이 메서드 하나로 제한)"
  - "MeetingRoomEntity.reservations 연관관계 필드는 이 도메인에서 사용하지 않는다(지연 로딩으로 전체 예약이 끌려오지 않게 한다)"
  - "서비스 사이 순환 의존 금지 — AdminReservationQueryService → ReservationService, MeetingRoomService 한 방향이며 MeetingRoomService는 다른 도메인 서비스를 호출하지 않는다. ReservationService도 MeetingRoomService만 호출한다"
  - "테스트는 단위(Mockito)와 통합(Testcontainers PostgreSQL, @SpringBootTest)으로 나눈다. 각 테스트 위에 // @trace {REQ} | {TE-ID}, {operationId} 주석을 단다. endpoint가 null인 항목은 // @trace {REQ} | {TE-ID}"
