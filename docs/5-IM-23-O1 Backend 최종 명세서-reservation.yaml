          - name: "meetingRoomId"
            type: "Long"
            description: "회의실 식별자"
          - name: "meetingRoomName"
            type: "String"
            description: "회의실명(회의실 도메인 값)"
          - name: "startAt"
            type: "LocalDateTime"
            description: "시작 일시"
          - name: "endAt"
            type: "LocalDateTime"
            description: "종료 일시"
          - name: "title"
            type: "String"
