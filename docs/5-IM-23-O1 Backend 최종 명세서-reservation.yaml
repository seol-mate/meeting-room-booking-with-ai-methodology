# 5-IM-23-O1 Backend 최종 명세서-reservation
# 참조: 5-IM-23 Backend 최종 명세서 생성 [DV]
# 소스 우선순위: API 명세서 > entities.yaml > 업무프로세스 정의서 > 공통 개발규칙 > Backend 초안

program:
  id: "reservation"
  name: "예약"
  project: "회의실 예약 시스템"
  version: "1.0"
  author: "설동혁 DV"
  authored_at: "2026-10-27"
  history:
    - version: "1.0"
      date: "2026-10-27"
      by: "설동혁 DV"
      note: "최초 작성"

source_inputs:
  api_spec: "5-IM-12-O1 API 명세서-reservation.yaml"
  entity_spec: "entities.yaml"
  backend_common_rules: "4-DN-21-O3 공통 개발규칙.md"
  backend_draft: "5-IM-21-O1 Backend 초안-reservation.md"
  domain_process: "3-AN-09-O1 업무프로세스 정의서.md"

api_contract:
  domain: "reservation"
  endpoints:
    - id: "reservation-001"
      method: "POST"
      path: "/api/v1/auth/login"
      req: ["REQ-F-001"]
      request_schema: "LoginRequest"
      response_schema: "LoginUser"
      errors: ["BAD_REQUEST", "INTERNAL"]
    - id: "reservation-002"
      method: "GET"
      path: "/api/v1/auth/me"
      req: ["REQ-F-001"]
      request_schema: null
      response_schema: "LoginUser"
      errors: ["UNAUTHORIZED"]
    - id: "reservation-003"
      method: "POST"
      path: "/api/v1/auth/signup"
      req: ["REQ-F-001"]
      request_schema: "SignupRequest"
      response_schema: "LoginUser"
      errors: ["BAD_REQUEST", "CONFLICT", "INTERNAL"]
    - id: "reservation-004"
      method: "GET"
      path: "/api/v1/auth/login-id-availability"
      req: ["REQ-F-001"]
      request_schema: null
      response_schema: "LoginIdAvailability"
      errors: ["BAD_REQUEST"]
    - id: "reservation-005"
      method: "GET"
      path: "/api/v1/reservations"
      req: ["REQ-F-002", "REQ-F-003", "REQ-F-004"]
      request_schema: null
      response_schema: "ReservationStatusItem[]"
      errors: ["BAD_REQUEST", "UNAUTHORIZED", "INTERNAL"]
    - id: "reservation-006"
      method: "POST"
      path: "/api/v1/reservations"
      req: ["REQ-F-003", "REQ-F-004"]
      request_schema: "ReservationCreateRequest"
      response_schema: "ReservationResult"
      errors: ["BAD_REQUEST", "UNAUTHORIZED", "NOT_FOUND", "CONFLICT", "UNPROCESSABLE", "INTERNAL"]
    - id: "reservation-007"
      method: "GET"
      path: "/api/v1/reservations/mine"
      req: ["REQ-F-005"]
      request_schema: null
      response_schema: "MyReservationItem[]"
      errors: ["UNAUTHORIZED", "INTERNAL"]
    - id: "reservation-008"
      method: "PATCH"
      path: "/api/v1/reservations/{reservationId}/cancel"
      req: ["REQ-F-005", "REQ-F-006"]
      request_schema: null
      response_schema: "ReservationCancelResult"
      errors: ["UNAUTHORIZED", "FORBIDDEN", "NOT_FOUND", "UNPROCESSABLE", "INTERNAL"]

domain_context:
  entities:
    - "ENT-02: Reservation(ReservationEntity) — 회의실 예약과 취소 이력"
    - "ENT-03: Reserver(ReserverEntity) — 로그인 계정과 역할"
    - "ENT-01: MeetingRoom(MeetingRoomEntity) — 회의실 도메인 소유, 이 도메인은 서비스 계약으로만 접근"
  state_transitions:
    - entity: "Reservation"
      field: "status"
      transitions:
        - from: "(없음)"
          to: "RESERVED"
          trigger: "reservation-006"
          condition: "시간 규칙(30분 단위, 30분 이상 4시간 이하, 종료가 시작보다 늦음)을 지키고 같은 회의실의 RESERVED 예약과 겹치지 않을 때"
        - from: "RESERVED"
          to: "CANCELLED"
          trigger: "reservation-008"
          condition: "예약자 본인 또는 ROOM_MANAGER이고 예약 시작 시각 전일 때. cancelled_at·cancelled_by를 기록한다"
        - from: "CANCELLED"
          to: "(종단)"
          trigger: "reservation-008"
          condition: "이미 취소된 예약의 재취소는 422로 거부한다"
  business_rules:
    - id: "BR-01"
      description: "같은 회의실에서 RESERVED 예약과 시간이 일부라도 겹치면 예약을 거부한다. 끝과 시작이 맞닿는 것은 겹침이 아니다. 최종 보증은 DB 배제 제약 ex_reservation_overlap"
      enforcement: "reservation-006"
    - id: "BR-02"
      description: "예약 취소는 삭제가 아니라 상태 갱신이다. 시작 전 예약만, 예약자 본인 또는 ROOM_MANAGER만 취소하고 이력을 남긴다"
      enforcement: "reservation-008"
    - id: "BR-03"
      description: "회의 제목은 예약자 본인과 ROOM_MANAGER에게만 보인다"
      enforcement: "reservation-005"

schema_context:
  tables:
    - table: "reserver"
      entity: "Reserver"
      relevant_fields:
        - column: "reserver_id"
          type: "Long"
          nullable: false
          description: "PK, 자동 증가"
        - column: "login_id"
          type: "String(50)"
          nullable: false
          description: "고유. 로그인 계정 식별자"
        - column: "password_hash"
          type: "String(255)"
          nullable: false
          description: "BCrypt 해시. 평문 저장·기록 금지"
        - column: "name"
          type: "String(100)"
          nullable: false
          description: "예약 현황에 표시되는 이름"
        - column: "role"
          type: "String(20)"
          nullable: false
          description: "USER 또는 ROOM_MANAGER, 기본 USER"
      relations:
        - "REL-01: Reserver → Reservation (1:N)"
    - table: "reservation"
      entity: "Reservation"
      relevant_fields:
        - column: "reservation_id"
          type: "Long"
          nullable: false
          description: "PK, 자동 증가"
        - column: "meeting_room_id"
          type: "Long"
          nullable: false
          description: "FK meeting_room. 읽기 전용 필드이고 변경은 meetingRoom 연관관계로 한다"
        - column: "reserver_id"
          type: "Long"
          nullable: false
          description: "FK reserver. 읽기 전용 필드이고 변경은 reserver 연관관계로 한다"
        - column: "start_at"
          type: "LocalDateTime"
          nullable: false
          description: "예약 시작 일시"
        - column: "end_at"
          type: "LocalDateTime"
          nullable: false
          description: "예약 종료 일시"
        - column: "title"
          type: "String(200)"
          nullable: true
          description: "회의 제목"
        - column: "status"
          type: "String(20)"
          nullable: false
          description: "RESERVED 또는 CANCELLED, 기본 RESERVED"
        - column: "cancelled_at"
          type: "LocalDateTime"
          nullable: true
          description: "취소 일시"
        - column: "cancelled_by"
          type: "Long"
          nullable: true
          description: "취소한 사용자의 식별자 값(연관관계 없음)"
      relations:
        - "REL-02: Reservation → MeetingRoom (N:1)"
        - "REL-01: Reservation → Reserver (N:1)"

backend_common_rules:
  response_style: "Envelope — 4-DN-21-O3 §2. 성공은 data에 DTO, 오류는 error.code·message(·errors)와 meta. 봉투 생성은 EnvelopeFactory 빈"
  paging: "해당 없음 — 이 도메인 목록 operation에 페이징이 없다(화면 명세에 요구 없음)"
  exception_handling: "공통 GlobalExceptionHandler(5-IM-04)가 처리한다. 업무 오류는 BusinessException(ErrorCode)을 던진다. 고유·배제 제약 위반(SQLState 23505, 23P01)은 409로 변환된다"
  transaction: "서비스 메서드 기본 읽기 전용(@Transactional(readOnly = true)), 변경은 @Transactional"
  logging: "[레벨] [requestId] [클래스명.메서드명] 메시지. 비밀번호·해시는 어떤 레벨에도 기록하지 않는다. 4xx는 WARN, 5xx는 ERROR"
  project_specific:
    - "인증은 서버 세션이다 — 로그인은 LoginSession.begin, 현재 사용자는 CurrentUserProvider로 읽는다. Spring Security 필터 체인은 쓰지 않는다"
    - "역할 판정은 서비스 진입에서 CurrentUserProvider.require()로 사용자를 얻고 LoginUser.hasRole(\"ROOM_MANAGER\")로 확인한다. 아니면 BusinessException(ErrorCode.FORBIDDEN)"
    - "시각은 시간대 없는 LocalDateTime과 공통 Clock(Asia/Seoul) 빈을 쓴다"
    - "다른 도메인의 Repository·엔티티를 직접 다루지 않는다. 회의실 정보는 회의실 도메인 서비스 계약으로만 얻는다"

backend_design:
  endpoints:
    - id: "reservation-001"
      description: "로그인 ID와 비밀번호를 대조해 세션을 시작한다"
      validation:
        - field: "loginId"
          rule: "필수, 1~50자"
          error: "BAD_REQUEST"
        - field: "password"
          rule: "필수"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ALL"
            condition: "인증 불필요(공개 경로)"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
        isolation: "READ_COMMITTED (기본)"
      persistence:
        query_strategy: "[JPA] ReserverRepository.findByLoginId"
      response_mapping:
        success: "data에 LoginUser(reserverId, name, role)"
        fail: "error.code ERR-4000, message rsv.login.submit.failed 문구. 계정 없음과 비밀번호 불일치를 구분하지 않는다"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "필수 누락, 계정 없음, 비밀번호 불일치(EX-RSV-01)"
        - http: 500
          code: INTERNAL
          condition: "계정 조회 장애"
    - id: "reservation-002"
      description: "현재 세션의 로그인 사용자를 돌려준다"
      validation: []
      authorization:
        roles:
          - role: "USER"
            condition: "로그인한 본인"
          - role: "ROOM_MANAGER"
            condition: "로그인한 본인"
      transaction:
        boundary: "서비스 호출 없이 컨트롤러가 CurrentUserProvider 결과를 변환"
      persistence:
        query_strategy: "AuthFilter 단계의 LoginUserLookup 어댑터가 ReserverRepository.findById 조회"
      response_mapping:
        success: "data에 LoginUser"
      error_mapping:
        - http: 401
          code: UNAUTHORIZED
          condition: "세션 없음·만료·사용자 없음(EX-RSV-02)"
    - id: "reservation-003"
      description: "예약자 계정을 만든다. 역할은 항상 USER"
      validation:
        - field: "loginId"
          rule: "필수, 1~50자, 중복 불가"
          error: "BAD_REQUEST / CONFLICT"
        - field: "name"
          rule: "필수, 1~100자"
          error: "BAD_REQUEST"
        - field: "password"
          rule: "필수"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ALL"
            condition: "인증 불필요(공개 경로)"
      transaction:
        boundary: "단일 서비스 메서드 @Transactional"
        isolation: "READ_COMMITTED (기본), 중복 최종 보증은 login_id 고유 제약"
      persistence:
        query_strategy: "[JPA] existsByLoginId 확인 후 save"
        write_operations:
          - "ReserverEntity 생성 후 ReserverRepository.save — role=USER, password_hash=BCrypt"
      response_mapping:
        success: "201, data에 LoginUser"
        fail: "error.code ERR-4090 등"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "필수 누락, 길이 초과"
        - http: 409
          code: CONFLICT
          condition: "이미 쓰는 로그인 ID"
        - http: 500
          code: INTERNAL
          condition: "계정 저장 실패(EX-RSV-03)"
    - id: "reservation-004"
      description: "로그인 ID 사용 가능 여부를 돌려준다"
      validation:
        - field: "loginId"
          rule: "필수, 1~50자"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "ALL"
            condition: "인증 불필요(공개 경로)"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
      persistence:
        query_strategy: "[JPA] ReserverRepository.existsByLoginId"
      response_mapping:
        success: "data에 LoginIdAvailability(available)"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "loginId 누락·길이 초과"
    - id: "reservation-005"
      description: "선택한 날짜의 RESERVED 예약 현황을 돌려준다. 제목은 본인·ROOM_MANAGER에게만"
      validation:
        - field: "date"
          rule: "필수, YYYY-MM-DD"
          error: "BAD_REQUEST"
        - field: "meetingRoomId"
          rule: "선택, 숫자"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "USER"
            condition: "제목은 본인 예약만"
          - role: "ROOM_MANAGER"
            condition: "제목 전체"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
      persistence:
        query_strategy: "[JPA] ReservationRepository @Query 프로젝션 — 그 날짜 범위, status=RESERVED, 선택 회의실. 회의실명은 MeetingRoomService.findNamesByIds"
      response_mapping:
        success: "data에 ReservationStatusItem 배열(회의실·시작 순)"
      error_mapping:
        - http: 400
          code: BAD_REQUEST
          condition: "date 형식 오류"
        - http: 401
          code: UNAUTHORIZED
          condition: "로그인하지 않음(EX-RSV-04)"
        - http: 500
          code: INTERNAL
          condition: "조회 실패(EX-RSV-05)"
    - id: "reservation-006"
      description: "로그인한 사용자 명의로 예약을 등록한다"
      validation:
        - field: "meetingRoomId"
          rule: "필수, 양의 정수"
          error: "BAD_REQUEST"
        - field: "startAt, endAt"
          rule: "필수, 일시 형식. 30분 단위, 길이 30분 이상 4시간 이하, 종료가 시작보다 늦음"
          error: "BAD_REQUEST / UNPROCESSABLE"
        - field: "title"
          rule: "선택, 최대 200자"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "USER"
            condition: "본인 명의로만"
          - role: "ROOM_MANAGER"
            condition: "본인 명의로만"
      transaction:
        boundary: "단일 서비스 메서드 @Transactional — 회의실 확인, 겹침 확인, 저장"
        isolation: "READ_COMMITTED (기본), 경쟁은 DB 배제 제약 ex_reservation_overlap이 최종 보증"
      persistence:
        query_strategy: "[JPA] MeetingRoomService.existsById, ReservationRepository 겹침 존재 확인 @Query"
        write_operations:
          - "ReservationEntity 생성 후 save — status=RESERVED, reserver=현재 사용자"
      response_mapping:
        success: "201, data에 ReservationResult"
      error_mapping:
        - http: 404
          code: NOT_FOUND
          condition: "없는 회의실"
        - http: 409
          code: CONFLICT
          condition: "시간 겹침(EX-RSV-08, BR-01)"
        - http: 422
          code: UNPROCESSABLE
          condition: "시간 규칙 위반(EX-RSV-07)"
        - http: 500
          code: INTERNAL
          condition: "저장 실패(EX-RSV-09)"
    - id: "reservation-007"
      description: "로그인한 사용자 본인의 예약(취소 이력 포함)을 돌려준다"
      validation: []
      authorization:
        roles:
          - role: "USER"
            condition: "본인 예약만"
          - role: "ROOM_MANAGER"
            condition: "본인 예약만"
      transaction:
        boundary: "단일 서비스 메서드(읽기 전용)"
      persistence:
        query_strategy: "[JPA] ReservationRepository @Query 프로젝션 — reserver_id 일치, start_at 내림차순. 회의실명은 MeetingRoomService.findNamesByIds"
      response_mapping:
        success: "data에 MyReservationItem 배열"
      error_mapping:
        - http: 401
          code: UNAUTHORIZED
          condition: "로그인하지 않음"
    - id: "reservation-008"
      description: "예약을 취소 상태로 바꾸고 취소 일시·취소자를 기록한다"
      validation:
        - field: "reservationId"
          rule: "경로 변수, 양의 정수(형식 오류는 공통 핸들러 400)"
          error: "BAD_REQUEST"
      authorization:
        roles:
          - role: "USER"
            condition: "본인 예약만"
          - role: "ROOM_MANAGER"
            condition: "모든 예약(시작 전만)"
      transaction:
        boundary: "단일 서비스 메서드 @Transactional"
        isolation: "READ_COMMITTED (기본), 예약 한 건 비관적 잠금(PESSIMISTIC_WRITE)"
      persistence:
        query_strategy: "[JPA] ReservationRepository.findByIdForUpdate"
        write_operations:
          - "ReservationEntity.cancel(cancelledAt, cancelledBy) — status=CANCELLED, cancelled_at, cancelled_by (변경 감지로 갱신)"
      response_mapping:
        success: "data에 ReservationCancelResult"
      error_mapping:
        - http: 403
          code: FORBIDDEN
          condition: "본인도 ROOM_MANAGER도 아님(EX-RSV-11)"
        - http: 404
          code: NOT_FOUND
          condition: "없는 예약"
        - http: 422
          code: UNPROCESSABLE
          condition: "시작 이후(EX-RSV-10) 또는 이미 취소됨"
        - http: 500
          code: INTERNAL
          condition: "취소·이력 저장 실패(EX-RSV-12)"

implementation_targets:
  controller:
    classes:
      - class: "AuthController"
        package: "com.example.meetingroom.domain.reservation.controller"
        endpoints:
          - id: "reservation-001"
            method_name: "login"
            annotations:
              - "@PostMapping(\"/api/v1/auth/login\")"
            request_type: "LoginRequest"
            response_type: "Envelope<LoginUserResponse>"
          - id: "reservation-002"
            method_name: "me"
            annotations:
              - "@GetMapping(\"/api/v1/auth/me\")"
            request_type: null
            response_type: "Envelope<LoginUserResponse>"
          - id: "reservation-003"
            method_name: "signup"
            annotations:
              - "@PostMapping(\"/api/v1/auth/signup\")"
              - "@ResponseStatus(HttpStatus.CREATED)"
            request_type: "SignupRequest"
            response_type: "Envelope<LoginUserResponse>"
          - id: "reservation-004"
            method_name: "loginIdAvailability"
            annotations:
              - "@GetMapping(\"/api/v1/auth/login-id-availability\")"
              - "클래스에 @Validated, loginId는 @RequestParam @NotBlank @Size(max = 50)"
            request_type: "loginId (쿼리 문자열)"
            response_type: "Envelope<LoginIdAvailabilityResponse>"
      - class: "ReservationController"
        package: "com.example.meetingroom.domain.reservation.controller"
        endpoints:
          - id: "reservation-005"
            method_name: "findStatus"
            annotations:
              - "@GetMapping(\"/api/v1/reservations\")"
              - "date는 @RequestParam @DateTimeFormat(iso = ISO.DATE) LocalDate, meetingRoomId는 선택 Long"
            request_type: "date, meetingRoomId (쿼리 문자열)"
            response_type: "Envelope<List<ReservationStatusItemResponse>>"
          - id: "reservation-006"
            method_name: "create"
            annotations:
              - "@PostMapping(\"/api/v1/reservations\")"
              - "@ResponseStatus(HttpStatus.CREATED)"
            request_type: "ReservationCreateRequest"
            response_type: "Envelope<ReservationResultResponse>"
          - id: "reservation-007"
            method_name: "findMine"
            annotations:
              - "@GetMapping(\"/api/v1/reservations/mine\")"
            request_type: null
            response_type: "Envelope<List<MyReservationItemResponse>>"
          - id: "reservation-008"
            method_name: "cancel"
            annotations:
              - "@PatchMapping(\"/api/v1/reservations/{reservationId}/cancel\")"
            request_type: "reservationId (경로 변수 Long)"
            response_type: "Envelope<ReservationCancelResultResponse>"

  dto:
