      - name: "LoginRequest"
        fields:
          - name: "loginId"
            type: "String"
            validation: "@NotBlank @Size(max = 50)"
            description: "로그인 ID"
          - name: "password"
            type: "String"
            validation: "@NotBlank"
            description: "비밀번호. toString·로그에 포함하지 않는다"
      - name: "SignupRequest"
        fields:
          - name: "loginId"
            type: "String"
            validation: "@NotBlank @Size(max = 50)"
            description: "로그인 ID"
          - name: "name"
            type: "String"
            validation: "@NotBlank @Size(max = 100)"
            description: "이름"
          - name: "password"
            type: "String"
            validation: "@NotBlank"
            description: "비밀번호. toString·로그에 포함하지 않는다"
      - name: "ReservationCreateRequest"
        fields:
          - name: "meetingRoomId"
            type: "Long"
            validation: "@NotNull @Positive"
            description: "예약할 회의실"
          - name: "startAt"
            type: "LocalDateTime"
