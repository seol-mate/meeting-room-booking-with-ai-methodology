          - name: "cancelledAt"
            type: "LocalDateTime"
            description: "취소 일시"

  service:
    classes:
      - class: "AccountService"
        package: "com.example.meetingroom.domain.reservation.service"
        methods:
          - name: "login"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. ReserverRepository.findByLoginId로 계정을 찾는다. 없으면 BusinessException(BAD_REQUEST, rsv.login.submit.failed 문구)"
              - "2. PasswordEncoder.matches로 비밀번호를 대조한다. 불일치면 1과 같은 예외(어느 쪽이 틀렸는지 구분하지 않는다)"
              - "3. LoginSession.begin(request, reserverId)로 세션을 시작한다 — HttpServletRequest는 컨트롤러가 넘기고 서비스는 세션 시작을 호출만 한다"
              - "4. LoginUserResponse로 변환해 반환한다"
          - name: "signup"
            transaction: "@Transactional"
            steps:
              - "1. existsByLoginId가 true면 BusinessException(CONFLICT, rsv.join.id.duplicate 문구)"
              - "2. PasswordEncoder.encode로 비밀번호를 해시한다"
              - "3. ReserverEntity(loginId, passwordHash, name, UserRole.USER)를 save한다"
              - "4. LoginUserResponse로 변환해 반환한다(세션은 시작하지 않는다)"
          - name: "loginIdAvailable"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. existsByLoginId의 부정값을 available로 반환한다"
          - name: "findLoginUser"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 포트 LoginUserLookup의 구현이다. ReserverRepository.findById(userId)로 조회한다"
              - "2. 있으면 LoginUser(reserverId, role 문자열)를 Optional로, 없으면 Optional.empty()를 반환한다"
      - class: "ReservationService"
        package: "com.example.meetingroom.domain.reservation.service"
        methods:
          - name: "findStatus"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. CurrentUserProvider.require()로 현재 사용자를 얻는다(없으면 401)"
              - "2. date의 00:00 이상 다음 날 00:00 미만, status=RESERVED, 선택 meetingRoomId로 ReservationRepository.findStatusRows를 조회한다"
              - "3. 행의 회의실 식별자 집합으로 MeetingRoomService.findNamesByIds를 한 번 호출해 회의실명을 붙인다"
              - "4. 제목은 현재 사용자가 ROOM_MANAGER이거나 행의 reserverId가 본인일 때만 담고 아니면 null"
              - "5. 회의실·시작 일시 순으로 ReservationStatusItemResponse 목록을 반환한다"
          - name: "create"
            transaction: "@Transactional"
            steps:
              - "1. CurrentUserProvider.require()로 현재 사용자를 얻는다"
              - "2. 시간 규칙을 확인한다 — 분이 00 또는 30, 종료가 시작보다 늦음, 길이 30분 이상 240분 이하. 어기면 BusinessException(UNPROCESSABLE, rsv.new.time.invalid 문구)"
              - "3. MeetingRoomService.existsById가 false면 BusinessException(NOT_FOUND)"
              - "4. ReservationRepository.existsOverlap이 true면 BusinessException(CONFLICT, rsv.new.time.overlap 문구)"
              - "5. ReserverEntity·MeetingRoomEntity는 EntityManager.getReference로 참조를 얻어 ReservationEntity(meetingRoom, reserver, startAt, endAt, title)를 save한다(제목은 공백이면 null)"
              - "6. saveAndFlush로 DB 제약 위반을 이 시점에 드러내고(공통 핸들러가 409로 변환) ReservationResultResponse로 반환한다"
          - name: "findMine"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. CurrentUserProvider.require()로 현재 사용자를 얻는다"
              - "2. ReservationRepository.findMineRows(reserverId)로 시작 일시 내림차순 조회한다(취소된 예약 포함)"
              - "3. MeetingRoomService.findNamesByIds로 회의실명을 붙여 MyReservationItemResponse 목록을 반환한다"
          - name: "cancel"
            transaction: "@Transactional"
            steps:
              - "1. CurrentUserProvider.require()로 현재 사용자를 얻는다"
              - "2. ReservationRepository.findByIdForUpdate(reservationId) — 없으면 BusinessException(NOT_FOUND)"
              - "3. 예약자 본인도 ROOM_MANAGER도 아니면 BusinessException(FORBIDDEN)"
              - "4. 이미 CANCELLED면 BusinessException(UNPROCESSABLE)"
              - "5. startAt이 지금(Clock) 이전이거나 같으면 BusinessException(UNPROCESSABLE, rsv.my.cancel.started 문구)"
              - "6. ReservationEntity.cancel(지금, 현재 사용자 reserverId)로 상태를 바꾼다"
              - "7. ReservationCancelResultResponse를 반환한다"
          - name: "findActiveReservationsInPeriod"
            transaction: "@Transactional(readOnly = true)"
            steps:
              - "1. 다른 도메인이 호출하는 서비스 계약이다(service_contracts 참조). 권한 확인은 호출 도메인이 한다"
              - "2. from의 00:00 이상 to 다음 날 00:00 미만, status=RESERVED, 선택 meetingRoomId로 ReservationRepository.findActiveInPeriod를 조회한다"
              - "3. 시작 일시 순의 ActiveReservation 목록을 반환한다(회의 제목 전체 포함)"

  service_contracts:
    - method: "ReservationService.findActiveReservationsInPeriod"
      called_by: ["meeting-room"]
      signature: "List<ActiveReservation> findActiveReservationsInPeriod(LocalDate from, LocalDate to, Long meetingRoomId)"
      req: ["REQ-F-006", "REQ-F-008"]
      description: "기간(시작일·종료일 포함) 안에 시작하는 RESERVED 예약을 시작 일시 순으로 돌려준다. meetingRoomId가 null이면 모든 회의실. ActiveReservation은 예약 식별자·회의실 식별자·예약자 이름·시작·종료·회의 제목을 가진다. 취소된 예약은 제외하고 예외는 없다"

  data_changes:
    - kind: "설정"
      req: ["REQ-F-001", "REQ-NF-001"]
      target: "backend/pom.xml 의존성 spring-security-crypto, common.config.PasswordEncoderConfig(BCryptPasswordEncoder 빈)"
      description: "비밀번호 해시용 BCrypt 인코더를 빈으로 등록한다. Spring Security 필터 체인은 도입하지 않는다"
    - kind: "비기능 클래스"
      req: ["REQ-F-005", "REQ-F-006"]
      target: "domain.reservation.entity.ReservationEntity.cancel(LocalDateTime cancelledAt, Long cancelledBy)"
      description: "예약 취소 상태 변경 메서드를 엔티티에 추가한다 — status를 CANCELLED로, cancelled_at·cancelled_by를 기록한다. 엔티티 코드 구현(5-IM-06)에는 변경 메서드가 없다"
    - kind: "비기능 클래스"
      req: ["REQ-F-001", "REQ-NF-001"]
      target: "domain.reservation.service.AccountService implements LoginUserLookup"
      description: "공통 기능(5-IM-04)이 선언한 포트 LoginUserLookup의 어댑터를 계정 서비스가 구현해 AuthFilter가 세션 사용자를 확인할 수 있게 한다"

  mapper:
    - name: "ReservationMapper"
      type: "manual"
      mappings:
        - "ReserverEntity → LoginUserResponse: LoginUserResponse.from(entity) (정적 팩토리, 서비스에서 호출)"
        - "ReservationEntity → ReservationResultResponse·MyReservationItemResponse: 서비스 메서드 안에서 변환(회의실명은 서비스 계약으로 받은 이름 맵을 사용)"
        - "프로젝션 행(ReservationStatusRow 등) → ReservationStatusItemResponse: 서비스에서 제목 가리기·회의실명을 적용해 변환"
        - "SignupRequest·ReservationCreateRequest → ReserverEntity·ReservationEntity: 서비스 메서드 안에서 생성자로 변환"

  repository:
    persistence: "jpa"
    interfaces:
      - name: "ReserverRepository"
        type: "JpaRepository"
        custom_queries:
          - "Optional<ReserverEntity> findByLoginId(String loginId)"
          - "boolean existsByLoginId(String loginId)"
      - name: "ReservationRepository"
        type: "JpaRepository"
        custom_queries:
          - "@Query 프로젝션 List<ReservationStatusRow> findStatusRows(LocalDateTime fromInclusive, LocalDateTime toExclusive, Long meetingRoomId) — status=RESERVED, startAt 범위, meetingRoomId가 null이면 전체, reserver 조인으로 예약자 식별자·이름 포함, 회의실·시작 순"
          - "@Query boolean existsOverlap(Long meetingRoomId, LocalDateTime startAt, LocalDateTime endAt) — 같은 회의실, status=RESERVED, 기존.startAt < 새 endAt 이고 새 startAt < 기존.endAt"
          - "@Query 프로젝션 List<MyReservationRow> findMineRows(Long reserverId) — 본인 예약 전체(취소 포함), startAt 내림차순"
          - "@Lock(LockModeType.PESSIMISTIC_WRITE) @Query Optional<ReservationEntity> findByIdForUpdate(Long reservationId)"
          - "@Query 프로젝션 List<ActiveReservation> findActiveInPeriod(LocalDateTime fromInclusive, LocalDateTime toExclusive, Long meetingRoomId) — status=RESERVED, reserver 조인으로 예약자 이름, startAt 순"
    querydsl:
      used: false
      methods: []

  validation:
    rules:
      - id: "BR-01"
        check: "ReservationRepository.existsOverlap이 true이면 등록하지 않는다. DB 배제 제약 ex_reservation_overlap이 경쟁 상황의 최종 보증이며 위반은 공통 핸들러가 409로 변환한다"
        throw: "BusinessException(ErrorCode.CONFLICT, \"이미 예약된 시간입니다.\")"
      - id: "BR-02"
        check: "취소는 예약자 본인 또는 ROOM_MANAGER만, 시작 시각 전 RESERVED 예약만 가능하다"
        throw: "BusinessException(ErrorCode.FORBIDDEN) / BusinessException(ErrorCode.UNPROCESSABLE, \"시작된 예약은 취소할 수 없습니다.\")"
      - id: "REQ-F-003"
        check: "시작·종료의 분이 00 또는 30이고, 종료가 시작보다 늦고, 길이가 30분 이상 4시간 이하"
        throw: "BusinessException(ErrorCode.UNPROCESSABLE, \"예약은 30분 단위로 최소 30분, 최대 4시간까지 가능합니다.\")"

  authorization:
    method_level: "공개 operation(reservation-001·003·004)은 공통 AuthFilter의 public-paths에 등록되어 있다. 그 밖의 경로는 AuthFilter가 로그인을 요구하고 서비스는 CurrentUserProvider.require()로 사용자를 얻는다"
    data_level: "reservation-005는 제목을 본인·ROOM_MANAGER에게만, reservation-007은 reserver_id가 본인인 예약만, reservation-008은 본인 또는 ROOM_MANAGER만"

  transaction:
    read_only_default: true
    write_methods:
      - "AccountService.signup"
      - "ReservationService.create"
      - "ReservationService.cancel"

  error_handling:
    additional:
      - "로그인 실패는 400 ERR-4000이며 error.errors 없이 message만 담는다(계정 없음과 비밀번호 불일치를 구분하지 않음)"
    state_dependent_validation:
      - trigger: "로그인 ID·비밀번호 대조 실패(reservation-001)"
        http: 400
        details_format: null
      - trigger: "예약 시간 규칙 위반(reservation-006)"
        http: 422
        details_format: null

  test_expectations:
    unit:
      - id: "TE-reservation-U01"
        req: ["REQ-F-001"]
        endpoint: "reservation-001"
        desc: "AccountService.login — 올바른 정보는 LoginUser를 반환하고, 계정 없음과 비밀번호 불일치는 같은 400 BusinessException을 던진다"
      - id: "TE-reservation-U02"
        req: ["REQ-F-001"]
        endpoint: "reservation-003"
        desc: "AccountService.signup — 중복 ID는 CONFLICT, 성공 시 role=USER이고 저장되는 값이 평문이 아닌 해시이며 요청에 role이 있어도 무시한다"
      - id: "TE-reservation-U03"
        req: ["REQ-F-001"]
        endpoint: "reservation-004"
        desc: "AccountService.loginIdAvailable·findLoginUser — 쓰는 ID는 available=false, 없는 사용자 식별자는 Optional.empty"
      - id: "TE-reservation-U04"
        req: ["REQ-F-002"]
        endpoint: "reservation-005"
        desc: "ReservationService.findStatus — 일반 사용자에게는 본인 예약 외 제목이 null이고 ROOM_MANAGER에게는 모두 보인다"
      - id: "TE-reservation-U05"
        req: ["REQ-F-002"]
        endpoint: "reservation-005"
        desc: "ReservationService.findStatus — 취소된 예약은 현황에 나오지 않고 회의실·시작 일시 순으로 정렬된다"
      - id: "TE-reservation-U06"
        req: ["REQ-F-003"]
        endpoint: "reservation-006"
        desc: "ReservationService.create — 30분 단위가 아님, 30분 미만, 4시간 초과, 종료가 시작보다 이름은 UNPROCESSABLE이고 경계값(30분, 4시간)은 통과한다"
      - id: "TE-reservation-U07"
        req: ["REQ-F-004"]
        endpoint: "reservation-006"
        desc: "ReservationService.create — 겹치면 CONFLICT, 끝과 시작이 맞닿으면 통과, 취소된 예약과는 겹치지 않으며, 없는 회의실은 NOT_FOUND"
      - id: "TE-reservation-U08"
        req: ["REQ-F-005"]
        endpoint: "reservation-007"
        desc: "ReservationService.findMine — 본인 예약만 취소된 예약 포함으로 시작 일시 내림차순 반환한다"
      - id: "TE-reservation-U09"
        req: ["REQ-F-005"]
        endpoint: "reservation-008"
        desc: "ReservationService.cancel — 시작 전 본인 예약은 CANCELLED가 되고 cancelled_at·cancelled_by가 기록된다. 시작 이후와 이미 취소된 예약은 UNPROCESSABLE"
      - id: "TE-reservation-U10"
        req: ["REQ-F-006"]
        endpoint: "reservation-008"
        desc: "ReservationService.cancel — 본인도 ROOM_MANAGER도 아닌 사용자는 FORBIDDEN, ROOM_MANAGER는 다른 사람 예약을 시작 전에 취소할 수 있다"
      - id: "TE-reservation-U11"
        req: ["REQ-F-008"]
        endpoint: null
        desc: "ReservationService.findActiveReservationsInPeriod(서비스 계약) — 기간 경계일 포함, RESERVED만, 회의실 지정 필터, 제목 전체 포함, 시작 일시 순"
    integration:
      - id: "TE-reservation-I01"
        req: ["REQ-F-001"]
        endpoint: "reservation-001"
        desc: "가입 → 로그인 → me 흐름 — 로그인 후 세션 쿠키로 me가 200, 세션 없이 me와 보호 경로는 401 봉투, 공개 경로 3개는 로그인 없이 호출된다(REQ-NF-001 포함)"
      - id: "TE-reservation-I02"
