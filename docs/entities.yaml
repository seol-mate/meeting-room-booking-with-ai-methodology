# 4-DN-12-O2 엔티티 명세서 (entities.yaml)
# 감사 컬럼(생성·수정 일시·주체)은 공통 상속 방식을 기본으로 하고 개별 엔티티에 적지 않는다.
# 테이블 감사 컬럼 정본(4-DN-14-O1 §1)과 테이블 접두어(4-DN-21-O3)가 확정되기 전이라 접두어 없이 짓는다 — 확정 뒤 개정으로 반영한다.
# 4-DN-11 생략 — bounded_context·aggregate_root·business_rules를 이 파일에 직접 기재한다.

meta:
  author: 설동혁 (PL)
  authored_at: 2026-10-27
  version: "1.0"
  history:
    - version: "1.0"
      changed_at: 2026-10-27
      changed_by: 설동혁 (PL)
      description: 최초 작성

entities:
  - name: MeetingRoom
    table: meeting_room
    ent_id: ENT-01
    bounded_context: 회의실
    aggregate_root: true
    origin: 신규
    req_ids: [REQ-F-002, REQ-F-007, REQ-F-008]
    fields:
      - name: meetingRoomId
        column: meeting_room_id
        type: Long
        pk: true
        nullable: false
        unique: false
        description: 회의실 식별자 (Auto Increment)
      - name: name
        column: name
        type: String
        pk: false
        nullable: false
        unique: false
        length: 100
        description: 회의실명 (REQ-F-007)
      - name: location
        column: location
        type: String
        pk: false
        nullable: true
        unique: false
        length: 200
        description: 회의실 위치 (REQ-F-007) [확인 필요] 위치 표기 형식 미정
      - name: capacity
        column: capacity
        type: Integer
        pk: false
        nullable: true
        unique: false
        description: 수용 인원 (REQ-F-007) [확인 필요] 필수 여부 미정
      - name: equipment
        column: equipment
        type: String
        pk: false
        nullable: true
        unique: false
        length: 500
        description: 비치 장비 설명(텍스트) (REQ-F-007)
    relations:
      - type: OneToMany
        target: Reservation
        fk_column: meeting_room_id
        cardinality: 1:N
        rel_id: REL-02
        name_ko: 예약을 받는다
        name_en: receivesReservations
    business_rules: []

  - name: Reservation
    table: reservation
    ent_id: ENT-02
    bounded_context: 예약
    aggregate_root: true
    origin: 신규
    req_ids: [REQ-F-002, REQ-F-003, REQ-F-004, REQ-F-005, REQ-F-006, REQ-F-008]
    fields:
      - name: reservationId
        column: reservation_id
        type: Long
        pk: true
        nullable: false
        unique: false
        description: 예약 식별자 (Auto Increment)
      - name: meetingRoomId
        column: meeting_room_id
        type: Long
        pk: false
        nullable: false
        unique: false
        description: 예약 대상 회의실 식별자 (REL-02)
      - name: reserverId
        column: reserver_id
        type: Long
        pk: false
        nullable: false
        unique: false
        description: 예약한 예약자 식별자 (REL-01)
      - name: startAt
        column: start_at
        type: LocalDateTime
        pk: false
        nullable: false
        unique: false
        description: 예약 시작 일시 (REQ-F-003; BR-01 겹침 판단 기준)
      - name: endAt
        column: end_at
        type: LocalDateTime
        pk: false
        nullable: false
        unique: false
        description: 예약 종료 일시 (REQ-F-003; BR-01 겹침 판단 기준)
      - name: title
        column: title
        type: String
        pk: false
        nullable: true
        unique: false
        length: 200
        description: 회의 제목, 예약자와 회의실 관리 담당자에게만 노출 (REQ-F-002, REQ-F-008; BR-03) [확인 필요] 필수 여부 미정
      - name: status
        column: status
        type: String
        pk: false
        nullable: false
        unique: false
        length: 20
        default: RESERVED
        description: 예약 상태 (RESERVED, CANCELLED) (REQ-F-005; BR-02)
      - name: cancelledAt
        column: cancelled_at
        type: LocalDateTime
        pk: false
        nullable: true
        unique: false
        description: 취소 일시, 취소 시에만 기록 (REQ-F-005; BR-02)
      - name: cancelledBy
        column: cancelled_by
        type: Long
        pk: false
        nullable: true
        unique: false
        description: 취소한 사용자의 식별자 값, 취소 시에만 기록 (REQ-F-005, REQ-F-006; BR-02)
    relations:
      - type: ManyToOne
        target: MeetingRoom
        fk_column: meeting_room_id
        cardinality: N:1
        rel_id: REL-02
        name_ko: 예약을 받는다
        name_en: receivesReservations
      - type: ManyToOne
        target: Reserver
        fk_column: reserver_id
        cardinality: N:1
        rel_id: REL-01
        name_ko: 예약한다
        name_en: reserves
    business_rules:
      - BR-01
      - BR-02
      - BR-03

  - name: Reserver
    table: reserver
    ent_id: ENT-03
    bounded_context: 예약
    aggregate_root: true
    origin: 신규
    req_ids: [REQ-F-001, REQ-F-006, REQ-F-007, REQ-NF-001]
    fields:
      - name: reserverId
        column: reserver_id
        type: Long
        pk: true
        nullable: false
        unique: false
        description: 예약자 식별자 (Auto Increment)
      - name: loginId
        column: login_id
        type: String
        pk: false
        nullable: false
        unique: true
        length: 50
        description: 로그인 계정 식별자, 중복 불가 (REQ-F-001)
      - name: passwordHash
        column: password_hash
        type: String
        pk: false
        nullable: false
        unique: false
        length: 255
        description: 비밀번호 해시 (REQ-F-001, REQ-NF-001)
      - name: name
        column: name
        type: String
        pk: false
        nullable: false
        unique: false
        length: 100
        description: 예약 현황에 표시되는 이름 (REQ-F-002)
      - name: role
        column: role
        type: String
        pk: false
        nullable: false
        unique: false
        length: 20
        default: USER
        description: 역할 (USER, ROOM_MANAGER), 회의실 관리 담당자 권한 구분 (REQ-F-006, REQ-F-007; BR-03) [확인 필요] 관리 담당자 지정 방식 미정
    relations:
      - type: OneToMany
        target: Reservation
        fk_column: reserver_id
        cardinality: 1:N
        rel_id: REL-01
        name_ko: 예약한다
        name_en: reserves
    business_rules:
      - BR-03
