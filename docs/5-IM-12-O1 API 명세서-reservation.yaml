        title:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ReservationStatus'
        cancelledAt:
          type: [string, 'null']
          description: "취소 일시 (로컬) — 취소된 예약에만 있다"

    ReservationCancelResult:
