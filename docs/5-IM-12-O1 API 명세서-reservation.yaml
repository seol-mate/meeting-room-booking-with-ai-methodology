  responses:
    BAD_REQUEST:
      description: "잘못된 요청 또는 입력 검증 실패 (400, ERR-4000) — 로그인 정보 오류(EX-RSV-01)도 여기에 속한다"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    UNAUTHORIZED:
      description: "로그인이 필요함 (401, ERR-4010) — 도메인 공통, EX-ID 없음(—)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    FORBIDDEN:
      description: "권한 없음 (403, ERR-4030) — 예약자 본인도 관리 담당자도 아닌 사용자의 취소 요청 등"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NOT_FOUND:
      description: "대상(회의실 또는 예약)을 찾을 수 없음 (404, ERR-4040)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    CONFLICT:
      description: "충돌 (409, ERR-4090) — 로그인 ID 중복 또는 예약 시간 겹침(BR-01, EX-RSV-08)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    UNPROCESSABLE:
      description: "업무 규칙 위반 (422, ERR-4220) — 시간 단위·길이 위반(EX-RSV-07), 시작 이후 취소(EX-RSV-10), 이미 취소된 예약"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    INTERNAL_SERVER_ERROR:
      description: "서버 내부 오류 (500, ERR-5000) — 저장·조회 실패(EX-RSV-03, 05, 09, 12)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
