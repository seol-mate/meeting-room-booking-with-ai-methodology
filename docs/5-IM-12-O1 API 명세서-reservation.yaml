    ReservationStatusItem:
      type: object
      description: "예약 현황의 예약 한 건 — 취소된 예약은 나오지 않는다"
      required: [reservationId, meetingRoomId, meetingRoomName, reserverName, startAt, endAt]
      properties:
        reservationId:
          type: integer
          format: int64
        meetingRoomId:
          type: integer
          format: int64
        meetingRoomName:
          type: string
          description: "회의실명 (회의실 도메인 값을 보여 주는 표시 필드)"
        reserverName:
          type: string
          description: "예약자 이름"
        startAt:
          type: string
          description: "시작 일시 (로컬)"
        endAt:
          type: string
          description: "종료 일시 (로컬)"
        title:
          type: [string, 'null']
          description: "회의 제목 — 예약자 본인과 ROOM_MANAGER에게만 값이 있고 그 밖에는 null (C-RSV-STS-002)"

    MyReservationItem:
      type: object
      description: "내 예약 한 건 — 취소한 예약 포함"
      required: [reservationId, meetingRoomId, meetingRoomName, startAt, endAt, status]
      properties:
        reservationId:
          type: integer
          format: int64
        meetingRoomId:
          type: integer
          format: int64
        meetingRoomName:
          type: string
          description: "회의실명 (회의실 도메인 값을 보여 주는 표시 필드)"
        startAt:
          type: string
          description: "시작 일시 (로컬)"
        endAt:
