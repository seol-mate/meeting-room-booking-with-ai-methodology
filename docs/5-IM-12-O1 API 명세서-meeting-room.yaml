# 5-IM-12-O1 API 명세서-meeting-room   (회의실 예약 시스템 — 회의실)
# x-domain-id: meeting-room  ← 3-AN-05-O1 §2 값
# 참조: 4-DN-36-O1 UI&UX 제약사항 (SCR-MTR-001 ~ SCR-MTR-003), 프로그램 목록(4-DN-21-O1) SVC-MTR-001
# 공통 스키마(Envelope · ValidationError): 이 파일의 components.schemas (4-DN-21-O3 §2 값 = Envelope)
# 인증: components.securitySchemes.cookieAuth (서버 세션 쿠키)
# 접근 권한: 역할 제한이 있는 operation은 x-roles(4-DN-31-O1 §3 접근 권한 코드)를 붙인다
#
# ─── 엔드포인트 목록 ────────────────────────────────────────────────────────
# operationId        METHOD  PATH                                 SUMMARY
# -----------------  ------  -----------------------------------  --------------------
# meeting-room-001   GET     /api/v1/meeting-rooms                회의실 목록 조회
# meeting-room-002   POST    /api/v1/meeting-rooms                회의실 등록
# meeting-room-003   GET     /api/v1/meeting-rooms/{meetingRoomId}  회의실 상세 조회
# meeting-room-004   PUT     /api/v1/meeting-rooms/{meetingRoomId}  회의실 변경
# meeting-room-005   GET     /api/v1/admin/reservations           전체 예약 조회
# ────────────────────────────────────────────────────────────────────────────
#
# [화면에 닿지만 이 파일에 operation을 두지 않은 것]
#   · 전체 예약 조회 화면(SCR-MTR-003)의 [취소] → 외부(도메인 reservation): reservation-008
#   · 회의실 삭제는 요구사항에 없어 두지 않는다(SCR-MTR-002 CRUD 표 D —)
#   · 목록 조회 operation은 화면 명세에 페이징 요구가 없어 페이징 파라미터를 두지 않았다
#
# [형식] OpenAPI 3.1 표준. 방법론 고유 항목은 x-domain-id · x-req-ids · x-nf-req-ids · x-roles 벤더 확장.

openapi: 3.1.0

info:
  title: "회의실 API"
  version: 1.0.0
  description: "회의실 예약 시스템의 회의실 도메인(회의실 목록·등록·변경, 전체 예약 조회) HTTP API 계약"
  x-domain-id: meeting-room
  x-nuriaim:
    author: "설동혁 (DV)"
    authored_at: "2026-10-27"
    history:
      - version: 1.0.0
        date: "2026-10-27"
        by: "설동혁 (DV)"
        note: "최초 작성"

tags:
  - name: meeting-room
    description: "회의실 마스터"
  - name: admin-reservation
    description: "회의실 관리 담당자의 전체 예약 조회"

servers:
  - url: "/"
    description: "상대 경로 — 실제 호스트는 배포 환경(4-DN-01-O1)이 정한다"

security:
  - cookieAuth: []

paths:

  /api/v1/meeting-rooms:
    get:
      operationId: meeting-room-001
      summary: 회의실 목록 조회
      description: "등록된 회의실을 모두 돌려준다. 회의실 목록 화면(SCR-MTR-001)은 ROOM_MANAGER만 접근하지만(C-MTR-LST-001), 예약 현황(SCR-RSV-003)의 표 행과 회의실 예약(SCR-RSV-004)의 선택 목록, 전체 예약 조회(SCR-MTR-003)의 조회 조건도 이 목록을 쓰므로 이 operation은 로그인한 USER·ROOM_MANAGER 모두에게 열려 있다. 회의실이 없으면 빈 배열."
      tags: [meeting-room]
      x-roles: [USER, ROOM_MANAGER]
      # 출처 — SCR-MTR-001 REQ-F-007 / SCR-RSV-003 REQ-F-002 / SCR-RSV-004 REQ-F-003, REQ-F-004 / SCR-MTR-003 조회 조건 REQ-F-008
      x-req-ids: [REQ-F-002, REQ-F-003, REQ-F-004, REQ-F-007, REQ-F-008]
      x-nf-req-ids: [REQ-NF-001]
      responses:
        '200':
          description: "조회 성공 — data 는 회의실 배열(회의실명 순)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MeetingRoomItem'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
    post:
      operationId: meeting-room-002
      summary: 회의실 등록
      description: "회의실을 새로 등록한다. ROOM_MANAGER만 가능하다(C-MTR-EDT-001, EX-MTR-02). 회의실명은 필수(최대 100자), 위치(200자)·수용 인원(정수)·비치 장비(500자)는 선택이다(C-MTR-EDT-002, 필수 여부 미확정 항목). 입력 오류는 400(EX-MTR-01), 저장 실패는 500(EX-MTR-03)."
      tags: [meeting-room]
      x-roles: [ROOM_MANAGER]
      # SCR-MTR-002 근거 REQ-F-007
      x-req-ids: [REQ-F-007]
      x-nf-req-ids: [REQ-NF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingRoomCreateRequest'
      responses:
        '201':
          description: "등록 성공 — data 는 만들어진 회의실"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeetingRoomItem'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'

  /api/v1/meeting-rooms/{meetingRoomId}:
    parameters:
      - name: meetingRoomId
        in: path
        required: true
        description: "대상 회의실 식별자"
        schema:
          type: integer
          format: int64
    get:
      operationId: meeting-room-003
      summary: 회의실 상세 조회
      description: "회의실 한 곳의 정보를 돌려준다. 회의실 등록·변경 화면(SCR-MTR-002)이 변경할 회의실을 불러올 때 쓴다(CRUD 표의 R). ROOM_MANAGER만 가능하다."
      tags: [meeting-room]
      x-roles: [ROOM_MANAGER]
      # SCR-MTR-002 근거 REQ-F-007
      x-req-ids: [REQ-F-007]
      x-nf-req-ids: [REQ-NF-001]
      responses:
        '200':
          description: "조회 성공 — data 는 회의실 단건"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeetingRoomItem'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'
    put:
      operationId: meeting-room-004
      summary: 회의실 변경
      description: "회의실 정보를 변경한다(전체 교체). 변경한 정보는 예약 화면(예약 현황 조회·회의실 예약)에 반영된다(C-MTR-EDT-003). ROOM_MANAGER만 가능하다(EX-MTR-02). 입력 오류는 400(EX-MTR-01), 저장 실패는 500(EX-MTR-03)."
      tags: [meeting-room]
      x-roles: [ROOM_MANAGER]
      # SCR-MTR-002 근거 REQ-F-007
      x-req-ids: [REQ-F-007]
      x-nf-req-ids: [REQ-NF-001]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingRoomUpdateRequest'
      responses:
        '200':
          description: "변경 성공 — data 는 변경된 회의실"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MeetingRoomItem'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '404':
          $ref: '#/components/responses/NOT_FOUND'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'

  /api/v1/admin/reservations:
    get:
      operationId: meeting-room-005
      summary: 전체 예약 조회
      description: "회의실 관리 담당자가 회의실과 기간별로 전체 예약(시간·예약자·회의 제목)을 조회한다. ROOM_MANAGER만 가능하다(C-MTR-ALL-001). 조회 기간의 시작일이 종료일보다 늦으면 400(C-MTR-ALL-002, mtr.all.period.invalid, EX-MTR-04). 취소된 예약은 제외한다(C-MTR-ALL-003). 이 목록의 [취소]는 외부(도메인 reservation): reservation-008 을 쓴다. 조회 실패는 500(EX-MTR-06)."
      tags: [admin-reservation]
      x-roles: [ROOM_MANAGER]
      # SCR-MTR-003 근거 REQ-F-006, REQ-F-008
      x-req-ids: [REQ-F-006, REQ-F-008]
      x-nf-req-ids: [REQ-NF-001]
      parameters:
        - name: from
          in: query
          required: true
          description: "조회 기간 시작일 (YYYY-MM-DD, 포함)"
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: "조회 기간 종료일 (YYYY-MM-DD, 포함)"
          schema:
            type: string
            format: date
        - name: meetingRoomId
          in: query
          required: false
          description: "특정 회의실만 조회할 때의 회의실 식별자. 생략하면 전체 회의실 (화면의 「전체」)"
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "조회 성공 — data 는 예약 배열(시작 일시 순). 기간에 예약이 없으면 빈 배열(mtr.all.list.empty)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminReservationItem'
        '400':
          $ref: '#/components/responses/BAD_REQUEST'
        '401':
          $ref: '#/components/responses/UNAUTHORIZED'
        '403':
          $ref: '#/components/responses/FORBIDDEN'
        '500':
          $ref: '#/components/responses/INTERNAL_SERVER_ERROR'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: "로그인 시 서버가 발급하는 세션 쿠키. 세션 만료 시간은 미확정(4-DN-36-O1 조건 C3)"

  schemas:
    Envelope:
      type: object
      description: "기본 응답 봉투 (success / data / error / meta) — 4-DN-21-O3 §2"
      properties:
        success:
          type: boolean
          description: "요청 성공 여부"
        error:
          type: [object, 'null']
          properties:
            code:
              type: string
              description: "오류 코드 (ERR-4000 등, 4-DN-21-O3 §4)"
            message:
              type: string
              description: "사용자에게 보일 수 있는 오류 설명"
            errors:
              type: [array, 'null']
              items:
                $ref: '#/components/schemas/ValidationError'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            requestId:
              type: string
              description: "요청 추적 ID (응답 헤더 X-Request-Id와 같다)"
      required: [success]

    ValidationError:
      type: object
      description: "검증 오류 항목 (error.errors[])"
      properties:
        field:
          type: string
          description: "오류가 발생한 필드명"
        value:
          type: [string, 'null']
          description: "입력된 값"
        reason:
          type: string
          description: "오류 사유"

    MeetingRoomCreateRequest:
      type: object
      description: "회의실 등록 요청"
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "회의실명 (mtr.edit.name.required)"
        location:
          type: [string, 'null']
          maxLength: 200
          description: "위치 — 선택 입력, 표기 형식 미확정"
        capacity:
          type: [integer, 'null']
          description: "수용 인원 — 선택 입력, 필수 여부 미확정"
        equipment:
          type: [string, 'null']
          maxLength: 500
          description: "비치 장비 설명 (텍스트)"

    MeetingRoomUpdateRequest:
      type: object
      description: "회의실 변경 요청 — 전체 교체이므로 등록 요청과 같은 항목을 모두 보낸다"
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: "회의실명 (mtr.edit.name.required)"
        location:
          type: [string, 'null']
          maxLength: 200
          description: "위치 — 선택 입력, 표기 형식 미확정"
        capacity:
          type: [integer, 'null']
          description: "수용 인원 — 선택 입력, 필수 여부 미확정"
        equipment:
          type: [string, 'null']
          maxLength: 500
          description: "비치 장비 설명 (텍스트)"

    MeetingRoomItem:
      type: object
      description: "회의실"
      required: [meetingRoomId, name]
      properties:
        meetingRoomId:
          type: integer
          format: int64
          description: "회의실 식별자"
        name:
          type: string
          description: "회의실명"
        location:
          type: [string, 'null']
          description: "위치"
        capacity:
          type: [integer, 'null']
          description: "수용 인원"
        equipment:
          type: [string, 'null']
          description: "비치 장비 설명"

    AdminReservationItem:
      type: object
      description: "전체 예약 조회의 예약 한 건 — 취소된 예약은 나오지 않는다"
      required: [reservationId, meetingRoomId, meetingRoomName, reserverName, startAt, endAt]
      properties:
        reservationId:
          type: integer
          format: int64
          description: "예약 식별자 — 취소 요청(외부(도메인 reservation): reservation-008)에 쓴다"
        meetingRoomId:
          type: integer
          format: int64
        meetingRoomName:
          type: string
          description: "회의실명"
        reserverName:
          type: string
          description: "예약자 이름 (예약 도메인 값을 보여 주는 표시 필드)"
        startAt:
          type: string
          description: "시작 일시 (시간대 없는 로컬 일시)"
        endAt:
          type: string
          description: "종료 일시 (시간대 없는 로컬 일시)"
        title:
          type: [string, 'null']
          description: "회의 제목 — ROOM_MANAGER에게는 항상 보인다"

  responses:
    BAD_REQUEST:
      description: "잘못된 요청 또는 입력 검증 실패 (400, ERR-4000) — 회의실 정보 입력 오류(EX-MTR-01), 조회 기간 오류(EX-MTR-04)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    UNAUTHORIZED:
      description: "로그인이 필요함 (401, ERR-4010) — 도메인 공통, EX-ID 없음(—)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    FORBIDDEN:
      description: "권한 없음 (403, ERR-4030) — ROOM_MANAGER가 아닌 사용자의 요청(EX-MTR-02)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    NOT_FOUND:
      description: "회의실을 찾을 수 없음 (404, ERR-4040)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    INTERNAL_SERVER_ERROR:
      description: "서버 내부 오류 (500, ERR-5000) — 저장·조회 실패(EX-MTR-03, 06)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
