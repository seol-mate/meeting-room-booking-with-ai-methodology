  pending_reapproval: []
  out_of_scope: []
  # 플랫폼을 쓰는 프로젝트는 세 목록을 비워 둔다 — 서버가 플랫폼 원장에서 상태를 조회한다.
  # 플랫폼이 없으면 아래 세 목록이 확정 상태다(점검 때 서버에 넘긴다 — _agent-rules 「세션·게이트 점검」).
  #
  # confirmed: 등급이 정한 확정 요건을 채운 산출물 ID 목록.
  # 확정 사건(approved·conditional·declared)을 적을 때 함께 갱신한다.
  # 플랫폼이 없으면 에이전트의 단계 진입 조건 판단 기준이다. 플랫폼을 쓰면 원장이 정본이고
  # 이 목록은 사람이 읽는 사본이다 — 그래도 같은 커밋에서 함께 옮긴다.
  #
  # pending_reapproval: 상류 개정(change_agreed의 invalidates)·반려·invalidated로 확정이 풀려
  # 재승인 대기 중인 산출물. 게이트 재통과 + G-APR 후 confirmed로 되돌린다.
  # 여기 있는 산출물은 확정이 아니며 하류 활동 진입에 쓸 수 없다.
  # 정정(버전 셋째 자리)은 목록을 옮기지 않는다 — 정정 버전이 확정 버전을 잇는다.
  #
  # out_of_scope: 이번 범위에서 만들지 않기로 PM이 결정한 산출물(근거 CR-·D-).
  # 하류 진입 조건은 confirmed ∪ out_of_scope로 판정한다.
  #
  # 세 목록을 옮길 때는 같은 커밋에서 .nuriaim/approvals.yaml에 사건을 추가한다(플랫폼 유무와 무관)
  # (상태·사건 정본: 9-CM-02 「확정 모델」, 파일 형식: 9-CM-01 「승인 기록」).
  #
  # 예시:
  #   confirmed:
  #     - 1-PN-01-O1   # 프로젝트 개요서
  #     - 2-MG-01-O1   # 수행계획서
  #     - 3-AN-08-O1   # 요구사항 정의서
  #     - 4-DN-12-O1   # 엔티티 명세서
