# .nuriaim/config.yaml — NuriAiM 프로젝트 설정
#
# 프로젝트 루트에 .nuriaim/ 폴더를 만들고 이 파일을 저장한다.
# MCP get_project_config 도구가 이 파일을 읽어 에이전트 프롬프트에
# 프로젝트 컨텍스트를 자동으로 주입한다.
#
# 사용법:
#   mkdir -p .nuriaim ./docs ./docs/raw
#   cp <이 파일 경로> ./.nuriaim/config.yaml
#   # {{...}} 자리표시자를 실제 값으로 채운다
#   # paths.output 또는 paths.input을 바꾸면 해당 디렉터리도 함께 만든다
#
# 동반 파일 (역할 결정 요청 라우팅 — _agent-rules.md 참조):
#   .nuriaim/session.yaml   — 이 세션의 수행 역할 (로컬·커밋 금지, .gitignore).
#                             session.yaml.example를 복사해 role을 채운다.
#   .nuriaim/requests/      — 역할 간 비동기 결정 요청 (커밋·공유; git으로 전달돼야
#                             다른 역할 세션에 닿는다). 요청이 생길 때 자동 생성된다.
#   .gitignore는 .nuriaim/.gitignore가 session.yaml만 무시하도록 이미 배포된다.

project:
  id: "meeting-room-booking" # 산출물 파일명 prefix (영문 소문자·하이픈, 예: nuriedu)
  name: "회의실 예약 시스템" # 한글 표시명 (예: NuriEdu — 사내 교육 관리 시스템)
  company: "" # 수행사(산출물 작성 조직) — 발주처는 project.client 유형과 개요서 §2
  repo: "" # 프로젝트 저장소 경로(예: lab/team/nuriedu) — 판정기가 git 좌표(output_ref)로 원본을 읽을 때 쓴다(_agent-rules 「대용량 입력」)
  # 백엔드 공통 프레임워크(공통부) 유형. 기술 스택이 아니다.
  # 값은 NuriAF | eGov | none 셋뿐이며, 4-DN-21-O3 공통 개발규칙의 적용 분기를 결정한다.
  #   NuriAF = 사내 공통 프레임워크 / eGov = 전자정부 표준 프레임워크 / none = 표준 공통 프레임워크 없음(자체 개발)
  # Spring Boot·React 같은 기술 스택은 여기가 아니라 1-PN-01-O1 프로젝트 개요서의
  # 기술 제약 표 '사용 가능 기술' 행에 기재한다.
  # 프론트엔드에는 대응하는 필드가 없다. FE는 공통 프레임워크 유형이 아니라 기술 스택으로
  # 갈리며, 스택 선택은 개요서 '사용 가능 기술', 필수 역량은 5-IM-01, 선택한 구현체는
  # 5-IM-05 코딩 컨벤션 산출물에서 정한다.
  # 개요서의 '공통 프레임워크' 항목과 같은 값이다 (개요서=사람이 읽는 자리, 여기=에이전트가 읽는 자리).
  # 미정이면 비워 두고 4-DN-21 진입 전까지 확정한다.
  framework: "none" # NuriAF | eGov | none
  # 프레임워크 버전(NuriAF는 Java 패키지 버전) — NuriAF 문서를 이 버전의 태그(java-<버전>)로 받는다(get_rule("nuriaf") 「버전을 맞춰 받는다」). 예: "3.0.31"
  framework_version: ""
  # FE 프레임워크 버전(NuriAF는 React 패키지 nuriaf7-react 버전) — Java와 따로 배포되므로 따로 적는다. 태그는 react-<버전>.
  #   두 버전의 태그가 다른 커밋이면 Git 이력에서 뒤에 오는 쪽으로 문서를 받는다(get_rule("nuriaf") 「버전을 맞춰 받는다」). 예: "0.15.3"
  framework_fe_version: ""
  # 프레임워크 자체를 개발하는 프로젝트면 true — framework: NuriAF와 함께 조건 분기 태그 [NuriAF-자체개발]을 켠다.
  framework_self: false
  # 프로젝트 유형 — 조건 분기 태그 [재구축]·[고도화]·[유지보수]가 읽는다. 개요서(1-PN-01-O1) §2 「프로젝트 유형」과 같은 값.
  # 신규(기본) | 재구축(옛 시스템을 새로 대체, 3-AN-04 기능 인벤토리) | 고도화(기존 코드 유지, 1-PN-02 편입) | 유지보수(편입·인계 뒤 8-OP-05 반복)
  type: "신규"
  # 발주처 유형 — 게이트 확인·서명 주체를 가른다. 값은 외부 | 내부 | 부재 셋뿐이다.
  #   외부 = 계약 상대가 발주처 / 내부 = 수행 조직의 발주 부서가 발주처 /
  #   부재 = 발주 부서 없이 수행 조직이 스스로 만드는 제품·시연(예: 프레임워크 자체 개발)
  # 정의·유형별 확인·서명 주체·남용 방지는 `9-CM-06 발주처 확인 규약`이 정본이다.
  # 킥오프 3-AN-02-O1 §7이 이 값을 인용해 확인자 명단·서명권자를 적는다.
  client: "부재" # 외부 | 내부 | 부재

# 고도화·유지보수만 — 기존 시스템의 편입 기준(1-PN-02). 신규·재구축은 비워 둔다.
baseline:
  repo: "" # 기존 시스템 저장소 URL(정본). 로컬 클론이면 "." 로 적고 URL은 주석으로 병기한다.
  commit: "" # 편입 기준 커밋 SHA(7~40자). 편입 확인서(1-PN-02-O1) §3 「기준 커밋」과 같은 값.
  mode:
    "역추출" # 역추출(기본 — 코드·DB·화면에서 산출물을 뽑는다) | 인계(NuriAiM으로 구축해 종료한 시스템을
    #   같은 저장소에서 이어 받는다 — repo ".", commit은 종료 기준선 태그의 커밋. 게이트 pn-02.P10,
    #   전환 순서는 8-OP-04 「프로젝트 종료 이후의 변경」)

# 방법론 버전 고정 (드리프트 방지) — get_project_config가 최신과 비교해 변경을 알린다.
methodology:
  version:
    "0.73.1" # 이 프로젝트가 고정할 방법론 버전 (예: "0.7.67").
    # 프로젝트 시작 시 현재 버전으로 세팅 권장(= 진행 중 문서가 안 바뀜, 기본 고정).
    #   - 값이 있으면: get_manual·get_template·get_common_guide 호출 시 이 값을
    #     methodology_version 파라미터로 함께 넘겨 해당 버전 스냅샷을 조회한다.
    #   - 비우면: 항상 최신(main)을 서빙(진행 중 바뀔 수 있음).
    # 업그레이드는 이 값을 올려 의도적으로 한다. get_project_config가 최신 버전과
    # 그 사이 변경 이력을 알려주므로, 언제·무엇이 바뀌는지 보고 올린다.

# 설계·구현에 사용하는 외부 도구 선언
# 활동 문서는 도구를 역할로 기술하고, 도구별 구체 절차는 9-CM-07(get_common_guide("design-tool"))
# 「생성 도구별 부록」으로 분리되어 있다.
# 도구를 바꾸면 이 값만 바꾸고 해당 부록을 참조한다.
tools:
  design: "" # 디자인 도구 (예: figma). designer_provided=false면 비워 둔다.
  design_to_code:
    "" # 디자인→코드 생성 도구 (예: figma-make). 4-DN-38·9-CM-07(get_common_guide("design-tool"))이 참조한다.
    # 비우면 4-DN-38에서 에이전트가 화면을 직접 만든다.

paths:
  output: "./docs" # 산출물 저장 루트 (프로젝트 루트 기준 상대경로)
  input: "./docs/raw" # 원본 입력 자료 루트 (RFP·기획서 등 변경되지 않는 외부 자료)
  ref: "./docs/ref" # 참고 문서·산출물 첨부(그림 등) 루트 — 공식 산출물이 아니다 (get_rule("paths"))
  nuriaf_docs: "./nuriaf7-docs" # NuriAF 프레임워크 문서 루트 (framework: NuriAF 인 경우에만 사용)

# 외부에서 가져오는 자원의 **출처**.
# paths가 "우리 저장소 어디에 있나"라면 여기는 "원래 어디서 가져왔나"다.
# 로컬에 이미 받아 둔 것도 출처를 남긴다 — subtree·clone은 받고 나면 흔적이 남지 않아,
# 세션·담당자가 바뀌면 후속 작업(갱신·재설치)에서 출처를 추측해야 한다.
#
# **자격증명(토큰·비밀번호)은 여기 적지 않는다.** 이 파일은 커밋된다.
# 인증은 사용자 수준 `~/.npmrc`·`~/.gitconfig`·환경변수 등 커밋되지 않는 자리에 두고, 여기에는
# "어디서 받는가"와 "무엇이 필요한가"만 적는다.
sources:
  framework_docs:
    "" # paths.nuriaf_docs를 clone·submodule·subtree로 받아 온 업스트림 저장소 URL.
    #   갱신 시 이 값이 없으면 출처를 찾지 못한다.
    #   NuriAF 프로젝트는 이 문서를 가장 먼저 받는다 — 나머지 값이 그 안에 있다.
    #   주소와 절차: get_rule("nuriaf")의 「없으면 먼저 받는다」
  framework_docs_ref:
    "" # 받은 문서의 버전 — 태그(java-3.0.31) 또는 태그가 없으면 커밋 해시.
    #   specs/ API 명세(프레임워크 제공 endpoint의 계약)가 이 버전으로 고정된다.
    #   빌드 파일·framework_version과 다르면 에이전트가 경고한다(get_rule("nuriaf") 「버전이 어긋나면 알린다」).
  framework_fe:
    "" # FE 프레임워크 소스 저장소 URL 또는 패키지 좌표.
    #   예: nuriaf7-react를 소스로 받으면 저장소 URL,
    #       패키지로 받으면 스코프·패키지명(@nis/nuriaf7-react)
  registry:
    "" # 사내 패키지 레지스트리 URL. 스코프 패키지(@nis/*)를 쓰면 필수.
    #   받기에는 토큰이 필요 없다(공개 레지스트리). 배포 등으로 필요하면 저장소 밖(~/.npmrc·환경변수)에 둔다.
    #   커밋되는 파일에 토큰을 평문으로 적지 않으며 여기에는 URL만 적는다.
    #
    # framework: NuriAF 프로젝트가 채울 값의 정본은
    # paths.nuriaf_docs/프레임워크-받기.md 다 (문서 저장소 주소만
    # get_rule("nuriaf")에 있다 — 문서를 받아야 읽을 수 있으므로).
    # 그 문서를 읽어 여기에 옮겨 적는다 — 문서를 읽을 수 있어도 이 값이
    # 비어 있으면 5-IM-01 진입 조건을 충족하지 않는다.

team: # 역할별 담당자 — 산출물 작성자 자동 채움에 사용 (선택)
  # 모든 역할은 쉼표로 복수 인원을 표기할 수 있고, 필요 시 괄호로 담당 범위를 명시한다.
  #   예: QA: "이영희(회의실·예약), 박민수(노쇼)"
  # 산출물 작성자에는 그 산출물의 담당자만 기재한다 (역할 전체 나열이 아니라).
  # 1인 다역(겸임)은 여기가 아니라 session.yaml의 role에서 다룬다.
  PM: ""
  PL: ""
  BA: ""
  DA: ""
  AA: ""
  TA: ""
  QA: ""
  UA: ""
  DV: "" # 개발자 (풀스택·도메인별 배정) — 복수 표기 시 괄호에 담당 도메인을 적는다

vcs:
  branch_model:
    "A" # A (GitHub Flow, main만) | B (GitHub Flow + dev, 통합 브랜치)
    # 프로젝트 시작 시 PM/PL이 결정. 미설정 시 모델 A를 기본으로 적용한다.
    # 상세 규칙: get_common_guide(guide_key="vcs") 참조

options:
  skip_stages: ["an-02", "an-06", "im-02", "dn-02", "dn-03", "dn-11", "dn-13", "dn-22"] # 생략할 활동 코드 목록 (예: ["dn-11", "dn-32", "dn-33"])
  designer_provided:
    false # 디자이너(UA) 참여 여부 — true | false (기본값 false)
    # true:  4-DN-33 디자인 컨셉의 값을 디자이너의 Figma에서 **전사**한다.
    #        인수 조건(Variables/Styles 토큰·Component Set)과 인수
    #        버전·일자 기록이 4-DN-33 진입 조건에 걸린다.
    # false: PL이 그 값을 결정한다.
    # 단계 구성·순서·게이트는 두 경우가 같다 — 값을 누가 정하느냐만 다르다.
    # 상세: 4-DN-00 「디자이너 참여 시」

