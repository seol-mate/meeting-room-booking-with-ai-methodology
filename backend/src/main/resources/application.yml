spring:
  application:
    name: meetingroom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meetingroom}
    username: ${DB_USERNAME:meetingroom}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션이 정본이다 (ERD-overview §1) — 엔티티와 어긋나면 기동 실패
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
