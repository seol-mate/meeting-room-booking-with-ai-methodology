spring:
  application:
    name: meetingroom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/meetingroom}
    username: ${DB_USERNAME:meetingroom}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션이 정본이다 (ERD-overview §1) — 엔티티와 어긋나면 기동 실패
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      # 세션 만료 시간은 미확정(UI&UX 제약사항 조건 C3) — 확정되면 이 값을 바꾼다
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    # 로그인 없이 접근을 허용하는 경로 — API 명세서(5-IM-12-O1 reservation)의 security: [] operation
    public-paths:
      - /actuator/health
      - /api/v1/auth/login
      - /api/v1/auth/signup
      - /api/v1/auth/login-id-availability
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  pattern:
    # [레벨] [requestId] [클래스명.메서드명] 메시지 — 공통 개발규칙(4-DN-21-O3) §5
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%-5level] [%X{requestId:-}] [%logger{0}.%M] %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
