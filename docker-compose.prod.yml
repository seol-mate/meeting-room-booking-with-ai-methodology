# 운영 환경 compose (7-DP-02) — 이 PC의 Docker에 web·api·db를 함께 기동한다 (배포 계획서 7-DP-01-O1 §2).
# 개발용 DB 전용 파일(docker-compose.yml)과 이름·볼륨·포트가 겹치지 않는다.
#
# 실행:  cp .env.prod.example .env.prod   # 값 채움 (.env.prod는 커밋하지 않는다)
#        docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build --wait
# 중지:  docker compose --env-file .env.prod -f docker-compose.prod.yml down      (볼륨 유지)
name: meetingroom-prod

services:
  db:
    image: postgres:17
    container_name: meetingroom-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 설정하세요}
      # UTF-8 + 한글 정렬(ICU ko-KR) — ERD-overview §1 「DB 로케일·콜레이션」
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ko-KR"
      TZ: Asia/Seoul
    volumes:
      - meetingroom-prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    # 호스트 포트를 열지 않는다 — api 컨테이너만 내부 네트워크로 접근한다

  api:
    build:
      context: ./backend
    image: meetingroom-api:${APP_VERSION:-1.0.0}
    container_name: meetingroom-prod-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: "8081"
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3200}
      TZ: Asia/Seoul
    networks: [internal]
    # 호스트 포트를 열지 않는다 — web이 /api/* 를 내부 네트워크로 넘긴다

  web:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8081
    image: meetingroom-web:${APP_VERSION:-1.0.0}
    container_name: meetingroom-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 이 PC 안에서만 접근한다(127.0.0.1). 8080(Jenkins)·5432(로컬 PostgreSQL)·3000(개발 서버)과 겹치지 않는 3200 (3100은 다른 Docker 프로젝트가 사용 중)
      - "127.0.0.1:${WEB_PORT:-3200}:3000"
    networks: [internal]

networks:
  internal:

volumes:
  meetingroom-prod-db-data:
